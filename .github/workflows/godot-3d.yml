name: ECHOFORM 3D Android build
on:
  push:
    branches: [feature/aaa-3d-foundation]
  workflow_dispatch:
jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools"
      - name: Install required Android packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Install Godot and Android export templates
        run: |
          set -eux
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Validate project
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path game --editor --quit
      - name: Configure Android export
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path game --export-debug Android "$GITHUB_WORKSPACE/build/echoform-debug.apk"
          test -s build/echoform-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echoform-3d-build
          path: build/*.apk
          if-no-files-found: error

  emulator-smoke:
    name: Install and launch Godot 3D game
    needs: validate-and-export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: echoform-3d-build
          path: apk
      - name: Confirm downloadable 3D APK
        run: test -s apk/echoform-debug.apk
      - name: Boot emulator, launch game, capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -eux
            adb install -r apk/echoform-debug.apk
            adb shell monkey -p com.echoform.game -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell pidof com.echoform.game
            adb shell screencap -p /sdcard/echoform-start.png
            adb pull /sdcard/echoform-start.png echoform-start.png
            adb shell input swipe 220 500 420 600 550
            sleep 3
            adb shell screencap -p /sdcard/echoform-move.png
            adb pull /sdcard/echoform-move.png echoform-move.png
            adb logcat -d -v threadtime > echoform-logcat.txt
            if grep -E 'FATAL EXCEPTION|Fatal signal|ANR in com.echoform.game' echoform-logcat.txt; then exit 1; fi
      - name: Publish emulator screenshots and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoform-3d-emulator-evidence
          path: |
            echoform-start.png
            echoform-move.png
            echoform-logcat.txt
          if-no-files-found: warn
