name: Realm AI Live v0.39.1 corrected Android build
# One-shot retry includes Gradle fix: dependency sample/test assets excluded.
on:
  push:
    branches: [feature/realm-ai-live-v039-retry-knowledge-20261101]
    paths:
      - '.github/workflows/realm-ai-live-v0391-build.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate sources, dependencies, and regression tests
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          node --check src/survival/navigation.js
          node --check src/survival/exploration-jobs.js
          node --test tests/jump-clearance-replan-isolated.test.cjs
          npm ci --omit=dev --no-audit --no-fund
          node --test tests/*.test.js
      - name: Reuse checked native ARM64 runtime from earlier Live APK
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: |
          set -euo pipefail
          python3 tools/fetch_native_runtime.py
          test -s android-app/app/src/main/jniLibs/arm64-v8a/libnode.so
          test -s android-app/app/src/main/jniLibs/arm64-v8a/libveilforge_bridge.so
      - name: Compile Android APK using official Gradle tooling
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign only with existing permanent Live identity, if configured
        id: sign
        env:
          VF_LIVE_KEYSTORE_B64: ${{ secrets.VF_LIVE_KEYSTORE_B64 }}
          VF_LIVE_STORE_PASSWORD_B64: ${{ secrets.VF_LIVE_STORE_PASSWORD_B64 }}
          VF_LIVE_KEY_PASSWORD_B64: ${{ secrets.VF_LIVE_KEY_PASSWORD_B64 }}
          VF_LIVE_KEY_ALIAS: ${{ secrets.VF_LIVE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$VF_LIVE_KEYSTORE_B64" ] || [ -z "$VF_LIVE_STORE_PASSWORD_B64" ] || [ -z "$VF_LIVE_KEY_ALIAS" ]; then
            echo "No permanent Live signing key configured. Compiled APK is unsigned and WILL NOT be published as an update."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export VF_LIVE_STORE_PASSWORD="$(printf '%s' "$VF_LIVE_STORE_PASSWORD_B64" | base64 -d)"
          export VF_LIVE_KEY_PASSWORD="$(printf '%s' "${VF_LIVE_KEY_PASSWORD_B64:-$VF_LIVE_STORE_PASSWORD_B64}" | base64 -d)"
          KEYSTORE="$RUNNER_TEMP/live-existing.p12"
          printf '%s' "$VF_LIVE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$TOOLS/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          INPUT=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -P 16 -f 4 "$INPUT" "$RUNNER_TEMP/live-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$VF_LIVE_KEY_ALIAS" --ks-pass env:VF_LIVE_STORE_PASSWORD --key-pass env:VF_LIVE_KEY_PASSWORD --out Realm-AI-Live-v0.39.1.apk "$RUNNER_TEMP/live-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs Realm-AI-Live-v0.39.1.apk > "$RUNNER_TEMP/cert.txt"
          grep -qi '77694d4f0068469cb6f7fd951f84946a4bbb833ae2702dc2f87b9e0c2adabf22' "$RUNNER_TEMP/cert.txt"
          "$TOOLS/zipalign" -c -P 16 4 Realm-AI-Live-v0.39.1.apk
          "$TOOLS/aapt" dump badging Realm-AI-Live-v0.39.1.apk > "$RUNNER_TEMP/package.txt"
          grep -q "package: name='com.veilforge.realmagent.live' versionCode='200020'" "$RUNNER_TEMP/package.txt"
          sha256sum Realm-AI-Live-v0.39.1.apk > SHA256SUMS.txt
          rm -f "$KEYSTORE"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Publish real verified APK update only when properly signed
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create realm-ai-live-0391-jump-recovery Realm-AI-Live-v0.39.1.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Realm AI Live v0.39.1 - bounded jump recovery' --notes 'Fixes Follow/Roam aborting when jump clearance changes. Previously signed v0.38 must remain installed; verified same certificate and higher versionCode. Test in a disposable Survival Realm.'
