name: Publish requested verified permanent-key APK download
on:
  push:
    branches:
      - sandbox/realm-ai-v0911-download-20261031
    paths:
      - '.github/workflows/realm-ai-publish-verified.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download original successful build artifact
        uses: actions/download-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-v0.9.11-Verified-APK
          run-id: 41183171273
          github-token: ${{ github.token }}
          path: original-build
      - name: Recover exact already-signed APK and verify pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(find original-build -name app-debug.apk -type f -print -quit)"
          SIGNER="$(find original-build -name apksigner.jar -type f -print -quit)"
          test -n "$SOURCE"; test -n "$SIGNER"
          python3 realm-ai-phone-build/materialize_verified_apk.py "$SOURCE" realm-ai-phone-build/v0911-permanent-apk-recipe.json.xz.b64 VEILFORGE-Realm-AI-v0.9.11-Permanent.apk
          java -jar "$SIGNER" verify --verbose --print-certs VEILFORGE-Realm-AI-v0.9.11-Permanent.apk > certificate-report.txt
          cat certificate-report.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: b5d275706b574eea53d6497a3a65542542b5db0e0e57f4e307e8ed17cf24f995' certificate-report.txt
          sha256sum VEILFORGE-Realm-AI-v0.9.11-Permanent.apk > VEILFORGE-Realm-AI-v0.9.11-SHA256.txt
      - name: Publish requested APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create veilforge-realm-ai-v0911-permanent-download VEILFORGE-Realm-AI-v0.9.11-Permanent.apk VEILFORGE-Realm-AI-v0.9.11-SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VEILFORGE Realm AI v0.9.11 — Permanent-Key Test APK" --notes "Exact verified permanent-key APK. SHA256 1afea4471d159a8dbdd122c8b9c33be26980127384a48a9e7661d608c2923b54. Contains pack-response wire correction and CDN fix; 104 Node tests and independent wire fixtures passed. Actual phone Realm joining remains unverified. Initial migration from old debug installation requires uninstall/re-login; Microsoft login limits may still apply. Future updates must reuse this permanent signing key. Private signing backup is not included. Hosted future signing setup is still pending owner configuration." --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-v0.9.11-Permanent-Download
          path: |
            VEILFORGE-Realm-AI-v0.9.11-Permanent.apk
            VEILFORGE-Realm-AI-v0.9.11-SHA256.txt
          retention-days: 7
