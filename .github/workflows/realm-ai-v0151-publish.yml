name: Publish requested v0.15.1 APK with 2026 permanent key
on:
  push:
    branches:
      - sandbox/realm-ai-v013-adaptive-recovery-20261031
    paths:
      - 'realm-ai-phone-build/v0151-publish-requests/**'
permissions:
  contents: write
concurrency:
  group: realm-v0151-requested-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct exact locally signed APK from public bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/timmytwopointoh/New-game-/releases/download/veilforge-realm-ai-v015-mining-building-preview/VEILFORGE-Realm-AI-v0.15-Mining-Building-PREVIEW.apk' -o public-base.apk
          python3 realm-ai-phone-build/materialize_v0151_apk.py public-base.apk realm-ai-phone-build/v0151-public-apk-recipe.json.xz.b64 VEILFORGE-Realm-AI-v0.15.1-Mining-Building-PREVIEW.apk
          sha256sum -c realm-ai-phone-build/v0151-publication/VEILFORGE-Realm-AI-v0.15.1-SHA256.txt
      - name: Install pinned Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Verify 2026 permanent identity, app version, alignment and runtime
        shell: bash
        run: |
          set -euo pipefail
          APK='VEILFORGE-Realm-AI-v0.15.1-Mining-Building-PREVIEW.apk'
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > certificate-report.txt
          cat certificate-report.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 8e902e783e7b4bd45ffe2f99b45c53b0e15d4b8e36092532cc6e969a956815c5' certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          tail -n 1 alignment-report.txt
          "$TOOLS/aapt" dump badging "$APK" > package-report.txt
          head -n 1 package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100007'" package-report.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('VEILFORGE-Realm-AI-v0.15.1-Mining-Building-PREVIEW.apk') as z:
              assert z.testzip() is None
              assert all(not n.endswith(('.p12','.pfx','.jks','.node')) and 'private/' not in n and 'signing-password' not in n for n in z.namelist())
              for name in ['lib/arm64-v8a/libnode.so','lib/arm64-v8a/libveilforge_bridge.so','assets/nodejs-project/src/survival/building.js','assets/nodejs-project/src/survival/mining.js']:
                  assert name in z.namelist(), name
          PY
      - name: Publish the verified test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='veilforge-realm-ai-v0151-mining-building-permanent-2026-preview'
          APK='VEILFORGE-Realm-AI-v0.15.1-Mining-Building-PREVIEW.apk'
          REPO="$GITHUB_REPOSITORY"
          NOTES='realm-ai-phone-build/v0151-publication/release-notes.md'
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" realm-ai-phone-build/v0151-publication/VEILFORGE-Realm-AI-v0.15.1-SHA256.txt certificate-report.txt alignment-report.txt package-report.txt realm-ai-phone-build/v0151-publication/verification.json --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --title 'VEILFORGE Realm AI v0.15.1 — Mining and Building Test' --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" realm-ai-phone-build/v0151-publication/VEILFORGE-Realm-AI-v0.15.1-SHA256.txt certificate-report.txt alignment-report.txt package-report.txt realm-ai-phone-build/v0151-publication/verification.json --repo "$REPO" --target "$GITHUB_SHA" --prerelease --title 'VEILFORGE Realm AI v0.15.1 — Mining and Building Test' --notes-file "$NOTES"
          fi
