name: Publish owner-requested Realm AI Live v0.21 baseline
on:
  push:
    branches: [sandbox/realm-ai-v013-adaptive-recovery-20261031]
    paths: ['realm-ai-phone-build/live-v021-publish-requests/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct and verify public signed APK
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/timmytwopointoh/New-game-/releases/download/realm-ai-live-020-secure-updates/Realm-AI-Live.apk' -o base.apk
          python3 realm-ai-phone-build/materialize_live_v021_apk.py base.apk realm-ai-phone-build/live-v021-public-recipe.json.xz.b64 Realm-AI-Live.apk
          echo '124f40a55a2fa759a9aea0b18ec2b2af941af4786424be8b29348172cf661ff0  Realm-AI-Live.apk' | sha256sum -c -
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$TOOLS/apksigner" ]; then "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'; fi
          "$TOOLS/apksigner" verify --verbose --print-certs Realm-AI-Live.apk > certificate-report.txt
          grep -qi '77694d4f0068469cb6f7fd951f84946a4bbb833ae2702dc2f87b9e0c2adabf22' certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 4 Realm-AI-Live.apk
          "$TOOLS/aapt" dump badging Realm-AI-Live.apk > package-report.txt
          grep -q "package: name='com.veilforge.realmagent.live' versionCode='200002'" package-report.txt
      - name: Publish public assets and signed update notice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload realm-ai-live-021-new-baseline Realm-AI-Live.apk realm-ai-phone-build/live-v021-publication/release.json realm-ai-phone-build/live-v021-publication/verification.json certificate-report.txt package-report.txt realm-ai-phone-build/realm-ai-live-v021-source.zip --clobber
          python3 realm-ai-phone-build/realm-ai-live-v021-overlay/release-tooling/publish_channel.py realm-ai-phone-build/live-v021-publication/release.json
