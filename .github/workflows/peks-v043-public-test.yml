name: Peks Plunder v0.43 downloadable Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: peks-public-v043-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify offline game file unchanged
        working-directory: peks-plunder
        run: |
          sha256sum -c SOURCE_SHA256.txt
          file app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build universal Android test APK
        working-directory: peks-plunder
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify built package and embedded game source
        working-directory: peks-plunder
        run: |
          set -euo pipefail
          a=app/build/outputs/apk/debug/app-debug.apk
          expected="$(cut -d ' ' -f1 SOURCE_SHA256.txt)"
          actual="$(unzip -p "$a" assets/index.html | sha256sum | cut -d ' ' -f1)"
          test "$expected" = "$actual"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$a"
          unzip -t "$a" | tail -n 1
          unzip -l "$a" | grep -q ic_launcher
          echo "Source verified: $actual"
      - name: Publish public APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp peks-plunder/app/build/outputs/apk/debug/app-debug.apk Peks-Plunder-v043.apk
          sha256sum Peks-Plunder-v043.apk | tee Peks-Plunder-v043-SHA256.txt
          TAG="peks-plunder-v043-public-test"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Peks-Plunder-v043.apk Peks-Plunder-v043-SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" Peks-Plunder-v043.apk Peks-Plunder-v043-SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Peks Plunder v0.43 — Android Test APK" --notes "Android compatibility test build, Android 6.0+; ES2017 JS and legacy DOM API fallbacks support older WebViews. No Google Play required. Universal (no native ABI restrictions). Source hash verified; original crab icon included. TEST-ONLY debug signing: backups are recommended before uninstalling old versions. Stable release signing is not configured. Browser and APK share the exact game source." --prerelease
          fi
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh release download peks-plunder-v043-public-test --repo "$GITHUB_REPOSITORY" --pattern 'Peks-Plunder-v043.apk' --dir apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install, launch, inspect WebView and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: bash .github/scripts/peks-v043-emulator-check.sh
      - name: Add QA artifacts to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in Peks-Plunder-v043-emulator.png peks-v043-log.txt; do
            if test -s "$f"; then
              gh release upload peks-plunder-v043-public-test "$f" --clobber --repo "$GITHUB_REPOSITORY" || true
            fi
          done
