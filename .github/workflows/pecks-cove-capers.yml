name: Cove Capers - spacious layout v0.4 APK and one emulator check
on:
  push:
    branches: [feature/pecks-cove-spacious-tables-v04-20261018]
    paths:
      - 'pecks-cove-capers/**'
      - '.github/workflows/pecks-cove-capers.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cove-manual-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Use hosted Android SDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Validate game logic offline
        run: |
          node --check pecks-cove-capers/web/game.js
          node pecks-cove-capers/test_logic.cjs
      - name: Build Android APK
        working-directory: pecks-cove-capers/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pecks-cove-capers-v04-apk
          path: pecks-cove-capers/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pecks-cove-capers-v04-apk
          path: apk
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: One Android WebView emulator visual smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r apk/app-debug.apk
            adb shell am start -n com.peckscove.capers/.MainActivity
            sleep 7
            mkdir -p screenshots
            adb logcat -d -s AndroidRuntime:E ActivityManager:E > screenshots/startup-logcat.txt || true\n            adb exec-out screencap -p > screenshots/cove-menu.png
            python3 -c 'import struct,subprocess; d=open("screenshots/cove-menu.png","rb").read(); assert d[:8]==bytes([137,80,78,71,13,10,26,10]); w,h=struct.unpack(">II",d[16:24]); print("Emulator menu",w,h); subprocess.run(["adb","shell","input","tap",str(w*84//100),str(h*66//100)],check=True)'\n            sleep 5
            adb exec-out screencap -p > screenshots/cove-gameplay.png
            python3 -c 'import struct,subprocess; d=open("screenshots/cove-menu.png","rb").read(); w,h=struct.unpack(">II",d[16:24]); x=str(w*10//100); y=str(h*81//100); subprocess.run(["adb","shell","input","swipe",x,y,x,y,"600"],check=True)'
            sleep 2
            adb exec-out screencap -p > screenshots/cove-after-controls.png
            adb logcat -d -s chromium:E cr_WebView:E AndroidRuntime:E > screenshots/cove-logcat.txt || true
            test -s screenshots/cove-gameplay.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pecks-cove-v04-emulator-evidence
          path: screenshots/
          retention-days: 3
