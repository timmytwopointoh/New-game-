name: Publish locally signed VEILFORGE Realm AI v0.21 sign-in link test APK
on:
  push:
    branches:
      - sandbox/realm-ai-v013-adaptive-recovery-20261031
    paths:
      - 'realm-ai-phone-build/v021-publish-requests/**'
permissions:
  contents: write
concurrency:
  group: realm-v021-requested-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct the exact signed APK from public bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/timmytwopointoh/New-game-/releases/download/veilforge-realm-ai-v020-language-chat-test/VEILFORGE-Realm-AI-v0.20-Language-TEST.apk' -o public-base.apk
          python3 realm-ai-phone-build/materialize_v021_apk.py public-base.apk realm-ai-phone-build/v021-public-apk-recipe.json.xz.b64 VEILFORGE-Realm-AI-v0.21-Microsoft-Link-TEST.apk
          cp realm-ai-phone-build/v021-publication/v021-source.zip .
          cp realm-ai-phone-build/v021-public-apk-recipe.json.xz.b64 .
          sha256sum -c realm-ai-phone-build/v021-publication/VEILFORGE-Realm-AI-v0.21-SHA256.txt
      - name: Install Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Verify package, alignment, signature and clickable Microsoft link
        shell: bash
        run: |
          set -euo pipefail
          APK='VEILFORGE-Realm-AI-v0.21-Microsoft-Link-TEST.apk'
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > certificate-report.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: b5d275706b574eea53d6497a3a65542542b5db0e0e57f4e307e8ed17cf24f995' certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          "$TOOLS/aapt" dump badging "$APK" > package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100018'" package-report.txt
          grep -q "versionName='0.21-language-chat'" package-report.txt
          python3 - <<'PY'
          import gzip, json, zipfile
          from pathlib import Path
          apk='VEILFORGE-Realm-AI-v0.21-Microsoft-Link-TEST.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=z.read('classes2.dex')
              for token in [b'https://www.microsoft.com/link',b'setAutoLinkMask',b'setLinksClickable',b'LinkMovementMethod']:
                  assert token in dex, token
              words=json.loads(gzip.decompress(z.read('assets/nodejs-project/src/lexicon/english-5000.json.gz')))
              assert len(words['words']) == 5000
          activity=Path('realm-ai-phone-build/v021-overlay/android-app/app/src/main/java/com/veilforge/realmagent/MainActivity.java').read_text()
          assert 'setAutoLinkMask(Linkify.WEB_URLS)' in activity
          assert 'LinkMovementMethod.getInstance()' in activity
          assert 'https://www.microsoft.com/link' in activity
          test=Path('realm-ai-phone-build/v021-overlay/android-app/app/src/test/java/com/veilforge/realmagent/ButtonActionsTest.java').read_text()
          assert 'links[0].getURL()' in test and 'Intent.ACTION_VIEW' in test
          PY
      - name: Publish APK and public source assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='veilforge-realm-ai-v021-microsoft-link-test'
          APK='VEILFORGE-Realm-AI-v0.21-Microsoft-Link-TEST.apk'
          ASSETS=("$APK" v021-public-apk-recipe.json.xz.b64 v021-source.zip realm-ai-phone-build/v021-publication/VEILFORGE-Realm-AI-v0.21-SHA256.txt realm-ai-phone-build/v021-publication/verification.json certificate-report.txt alignment-report.txt package-report.txt)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'VEILFORGE Realm AI v0.21 — Microsoft Sign-in Link TEST' --notes-file realm-ai-phone-build/v021-publication/release-notes.md
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title 'VEILFORGE Realm AI v0.21 — Microsoft Sign-in Link TEST' --notes-file realm-ai-phone-build/v021-publication/release-notes.md
