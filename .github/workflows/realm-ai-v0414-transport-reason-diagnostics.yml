name: Realm AI Live v0.40.14 pack wire evidence and RakNet numeric close; no-mod unchanged
on:
  push:
    branches: [fix/realm-ai-live-v0414-transport-diagnostics-20261103]
    paths: ['.github/workflows/realm-ai-v0414-transport-reason-diagnostics.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original Android identity, unchanged Switch profile and new fix
        run: |
          set -euo pipefail
          ROOT=realm-ai-phone-build/realm-ai-live-v021-overlay
          grep -q "applicationId 'com.veilforge.realmagent.live'" "$ROOT/android-app/app/build.gradle"
          grep -q 'versionCode 200043' "$ROOT/android-app/app/build.gradle"
          grep -q "versionName '0.40.14-pack-wire-diagnostics'" "$ROOT/android-app/app/build.gradle"
          grep -q "authTitle:'00000000441cc96b',deviceType:'Nintendo',deviceOS:12,flow:'live'" "$ROOT/bedrock-agent/src/options.js"
          grep -Fq "preparePackResponseWire(options,undefined,{strategy:'original-working'})" "$ROOT/bedrock-agent/src/connection.js"
          echo 'Identity, original saved-auth path and v0.40.14 source checks passed.'
      - name: Restore exact verified Bedrock Live runtime dependencies
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-fund --no-audit
          curl -fsSL --retry 3 --retry-all-errors 'https://github.com/timmytwopointoh/New-game-/releases/download/realm-ai-live-0395-pack-order-and-timing/Realm-AI-Live.apk' -o /tmp/previous-live.apk
          echo 'e3e8b829e1b3c7113f9a8a23fa243a74c7c0dd3aba41a036af74d01bc9affebf  /tmp/previous-live.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,shutil,pathlib
          target=pathlib.Path('node_modules');shutil.rmtree(target,ignore_errors=True);target.mkdir()
          prefix='assets/nodejs-project/node_modules/'
          count=0
          with zipfile.ZipFile('/tmp/previous-live.apk') as z:
              for item in z.infolist():
                  if not item.filename.startswith(prefix) or item.is_dir():continue
                  relative=pathlib.PurePosixPath(item.filename[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts:raise RuntimeError('Unsafe path')
                  out=target.joinpath(*relative.parts);out.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(item) as src,open(out,'wb') as dest:shutil.copyfileobj(src,dest)
                  count+=1
          assert count>=11000,count
          assert (target/'bedrock-protocol/src/client/realmJoin503Retry.js').exists()
          PY
      - name: Test exact packet wire encoding and all bot code
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm run check
          node --test tests/*.test.js
      - name: Restore verified Android ARM64 Node runtime
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: python3 tools/fetch_native_runtime.py
      - name: Test Android app UI, service and offline ZIP diagnostics
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile unsigned original-app APK
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package/version and embedded patched protocol code
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          SRC=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$SRC"
          mkdir -p "$RUNNER_TEMP/realm-v0414"
          "$BT/zipalign" -P 16 -f 4 "$SRC" "$RUNNER_TEMP/realm-v0414/Realm-AI-Live-v0.40.14-ALIGNED-UNSIGNED.apk"
          "$BT/zipalign" -c -P 16 4 "$RUNNER_TEMP/realm-v0414/Realm-AI-Live-v0.40.14-ALIGNED-UNSIGNED.apk"
          "$BT/aapt" dump badging "$RUNNER_TEMP/realm-v0414/Realm-AI-Live-v0.40.14-ALIGNED-UNSIGNED.apk" | tee "$RUNNER_TEMP/realm-v0414/package-report.txt"
          grep -q "package: name='com.veilforge.realmagent.live' versionCode='200043'" "$RUNNER_TEMP/realm-v0414/package-report.txt"
          python3 - <<'PY'
          import zipfile
          path=__import__('os').environ['RUNNER_TEMP']+'/realm-v0414/Realm-AI-Live-v0.40.14-ALIGNED-UNSIGNED.apk'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              code=z.read('assets/nodejs-project/src/bedrock-pack-wire-compat.js')
              conn=z.read('assets/nodejs-project/src/connection.js')
              assert b"MODERN_VERSION='1.26.60'" in code
              assert b"'2':'send_packs'" in code
              assert b"preparePackResponseWire(options,undefined,{strategy:'original-working'})" in conn
              assert 'assets/nodejs-project/src/pack-storage.js' in z.namelist()
              assert 'assets/nodejs-project/src/pack-protocol-observer.js' in z.namelist()
              assert 'assets/nodejs-project/src/transport-evidence.js' in z.namelist()
              assert 'assets/nodejs-project/src/pack-handshake-forensics.js' in z.namelist()
              packs=z.read('assets/nodejs-project/src/realm-packs.js')
              assert b"handshakeMode='cache-first'" in packs
              assert b"handshakeMode='original-working'" in conn
              assert b"useCurrentModded=handshakeMode==='original-working'" in packs
              assert b"sendCurrentModdedPackResponse(client,packet)" in packs
              assert b"if(packs.size){" in packs and b"installModdedRadiusGuard()" in packs
          assert b"vf-pack-response-submit" in z.read('assets/nodejs-project/src/modded-pack-response.js')
          assert b"classifyTransportClose" in z.read('assets/nodejs-project/src/transport-evidence.js')
          assert b"transportCloseCode" in z.read('assets/nodejs-project/src/connection.js')
          assert b"transportPackReliableSubmissions" in z.read('assets/nodejs-project/src/diagnostic-store.js')
              assert b"client.write('client_cache_status',{enabled:false})" in packs
              assert b"moddedCacheStatusSent=true" in packs
              assert b"if(name==='client_cache_status'&&moddedCacheStatusSent)return" in packs
              assert b"if(name==='request_chunk_radius'&&!canRequestTerrain())" in packs
              assert b"if(moddedRadiusGuard&&client.queue===moddedRadiusGuard)" in packs
              assert b"if(!useCurrentModded)client.write" in packs
              assert 'assets/nodejs-project/src/modded-pack-response.js' in z.namelist()
              modern=z.read('assets/nodejs-project/src/modded-pack-response.js')
              assert b"frame[id.next]=CURRENT[status]" in modern
              assert b"'native-queue','no-cache-status','cache-first'" in packs
              assert b'packVerifiedCacheCount' in packs
              assert b'noPackGraceMs' in packs
              assert b'packNoPackDirectStack' in z.read('assets/nodejs-project/src/diagnostic-store.js')
              assert b"missing.map(p=>p.key)" in packs
              assert b"p.file+'.sha256'" in packs
              assert b"packHandshakeMode" in z.read('assets/nodejs-project/src/diagnostic-store.js')
              assert b'createPackHandshakeForensics(client' in conn
              assert b"send_packs:'Downloading'" in z.read('assets/nodejs-project/src/realm-packs.js')
              assert b'observeBedrockTransport(client)' in conn
              assert 'lib/arm64-v8a/libnode.so' in z.namelist()
          print('Original-ID APK embeds exact 1.26.60 wire fix and native runtime')
          PY
          sha256sum "$RUNNER_TEMP/realm-v0414/Realm-AI-Live-v0.40.14-ALIGNED-UNSIGNED.apk" > "$RUNNER_TEMP/realm-v0414/SHA256SUMS.txt"
      - name: Retain unsigned original for private same-key signing (no keys in CI)
        uses: actions/upload-artifact@v4
        with:
          name: realm-ai-live-v0414-private-signing
          path: ${{ runner.temp }}/realm-v0414/
          if-no-files-found: error
          retention-days: 3

# Recheck updated CDN and watchdog canonical wire-name regression assertions.

# Rebuild after migrating legacy pack location test assertions to categorized cache paths.

# Verify old CDN-resume test now checks the categorized private partial path.

# Re-run after expanding fixed ZIP-file manifest and forensic privacy regression coverage.

# UI regression suite updated for the single ZIP export entry point.

# Rebuild after restoring Java fluent JSONObject chaining in one-tap ZIP export.

# Validates the direct no-pack stack fast path, the timed ACK fallback, and SHA-verified cache-only requests.

# Final rebuild: preserve original lowercase pack-response names in the one-tap diagnostic export.

# Final regression run includes revised historical test: only modded worlds wrap early radius, no-mod world queue stays byte-identical.
