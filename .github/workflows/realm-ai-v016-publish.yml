name: Publish requested VEILFORGE Realm AI v0.16 test APK
on:
  push:
    branches:
      - sandbox/realm-ai-v013-adaptive-recovery-20261031
    paths:
      - 'realm-ai-phone-build/v016-publish-requests/**'
permissions:
  contents: write
concurrency:
  group: realm-v016-requested-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct exact locally signed APK from public APK bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/timmytwopointoh/New-game-/releases/download/veilforge-realm-ai-v0151-mining-building-permanent-2026-preview/VEILFORGE-Realm-AI-v0.15.1-Mining-Building-PREVIEW.apk' -o public-base.apk
          python3 realm-ai-phone-build/materialize_v016_apk.py public-base.apk realm-ai-phone-build/v016-public-apk-recipe.json.xz.b64 VEILFORGE-Realm-AI-v0.16-Creative-Compact-Controls-TEST.apk
          sha256sum -c realm-ai-phone-build/v016-publication/VEILFORGE-Realm-AI-v0.16-SHA256.txt
          sha256sum -c <(printf '%s  %s\n' '0f92cc0c22829328e710f406bf2bb27da74762c8d871ca86bfbd47d6d635a4d7' 'realm-ai-phone-build/v016-source-overlay.tar.xz')
      - name: Install pinned Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Verify permanent certificate, version, alignment and embedded agent
        shell: bash
        run: |
          set -euo pipefail
          APK='VEILFORGE-Realm-AI-v0.16-Creative-Compact-Controls-TEST.apk'
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > certificate-report.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 8e902e783e7b4bd45ffe2f99b45c53b0e15d4b8e36092532cc6e969a956815c5' certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          tail -n 1 alignment-report.txt
          "$TOOLS/aapt" dump badging "$APK" > package-report.txt
          head -n 1 package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100009'" package-report.txt
          grep -q "versionName='0.16-creative-mode-compact-ui'" package-report.txt
          python3 - <<'PY'
          import zipfile
          apk='VEILFORGE-Realm-AI-v0.16-Creative-Compact-Controls-TEST.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert all(not n.endswith(('.p12','.pfx','.jks','.node')) and 'private/' not in n and 'signing-password' not in n for n in names)
              for name in ['lib/arm64-v8a/libnode.so','lib/arm64-v8a/libveilforge_bridge.so','assets/nodejs-project/src/survival/world.js','assets/nodejs-project/src/survival/verification.js','assets/nodejs-project/src/survival/mining.js','assets/nodejs-project/src/survival/building.js','assets/nodejs-project/src/survival/command-catalog.json']:
                  assert name in names, name
          PY
      - name: Publish verified APK and source overlay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='veilforge-realm-ai-v016-creative-compact-controls-test'
          APK='VEILFORGE-Realm-AI-v0.16-Creative-Compact-Controls-TEST.apk'
          REPO="$GITHUB_REPOSITORY"
          NOTES='realm-ai-phone-build/v016-publication-release-notes.md'
          ASSETS=("$APK" realm-ai-phone-build/v016-source-overlay.tar.xz realm-ai-phone-build/v016-publication/VEILFORGE-Realm-AI-v0.16-SHA256.txt realm-ai-phone-build/v016-publication/verification.json certificate-report.txt alignment-report.txt package-report.txt)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --title 'VEILFORGE Realm AI v0.16 — Creative Movement Test' --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$REPO" --target "$GITHUB_SHA" --prerelease --title 'VEILFORGE Realm AI v0.16 — Creative Movement Test' --notes-file "$NOTES"
          fi
