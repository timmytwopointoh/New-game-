name: Realm AI inventory and Survival diagnostic test APK (one-time)
on:
  push:
    branches:
      - sandbox/realm-ai-v014-inventory-survival-diagnostics-20261031
    paths:
      - '.github/workflows/realm-ai-inventory-debug-apk.yml'
permissions:
  contents: write
concurrency:
  group: realm-ai-inventory-diagnostic-one-time
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install reviewed Android SDK 35 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Reconstruct existing v0.14 source with server inventory and mode diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 realm-ai-phone-build/prepare_v014.py "$RUNNER_TEMP/realm-inventory-preview"
          ROOT="$RUNNER_TEMP/realm-inventory-preview/veilforge_realm_v09_apk_ready"
          test -f "$ROOT/bedrock-agent/src/survival/inventory-evidence.js"
          test -f "$ROOT/bedrock-agent/tests/inventory-mode-integration.test.js"
          test -f "$ROOT/bedrock-agent/src/survival/command-catalog.json"
          echo "VF_REALM_BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Run bot regression tests including real serializer and new inventory cases
        shell: bash
        run: |
          set -euo pipefail
          cd "$VF_REALM_BUILD_ROOT/bedrock-agent"
          # Earlier test expected immediate success, which is intentionally no longer true.
          # Updating only this assertion preserves all remaining packet/serializer checks.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/recovery.test.js')
          text=p.read_text()
          assert text.count('/Selected/') == 1, 'Review changed upstream recovery assertion'
          p.write_text(text.replace('/Selected/', '/waiting for server confirmation/'))
          PY
          npm test
          node --test tests/inventory-mode-diagnostics.test.js tests/inventory-mode-integration.test.js
      - name: Build separate installable test APK, preserving existing signed production app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          app=Path(os.environ['VF_REALM_BUILD_ROOT'])/'android-app/app/build.gradle'
          value=app.read_text()
          assert value.count("versionCode 100004")==1
          assert value.count("versionName '0.14-survival-controls'")==1
          assert value.count("buildTypes { debug { signingConfig = null } }")==1
          value=value.replace("versionCode 100004","versionCode 100005").replace("versionName '0.14-survival-controls'","versionName '0.14.1-inventory-diagnostic'")
          value=value.replace("buildTypes { debug { signingConfig = null } }","buildTypes { debug { applicationIdSuffix '.diagnostic'; signingConfig signingConfigs.debug } }")
          app.write_text(value)
          PY
          (cd "$VF_REALM_BUILD_ROOT" && python3 tools/prepare_android_node.py)
          gradle -p "$VF_REALM_BUILD_ROOT/android-app" :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify actual signed installable APK and embedded new bot code
        shell: bash
        run: |
          set -euo pipefail
          APK="$VF_REALM_BUILD_ROOT/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libveilforge_bridge.so$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/survival/inventory-evidence.js$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" > package.txt
          grep -q "package: name='com.veilforge.realmagent.diagnostic' versionCode='100005'" package.txt
          cp "$APK" VEILFORGE-Realm-AI-v0.14.1-Inventory-Diagnostic.apk
          sha256sum VEILFORGE-Realm-AI-v0.14.1-Inventory-Diagnostic.apk > VEILFORGE-Realm-AI-v0.14.1-SHA256.txt
      - name: Publish verified standalone diagnostic APK for requested manual test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "veilforge-realm-ai-v0141-inventory-diagnostic" VEILFORGE-Realm-AI-v0.14.1-Inventory-Diagnostic.apk VEILFORGE-Realm-AI-v0.14.1-SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Realm AI v0.14.1 — Inventory and Survival Diagnostic TEST" --notes "SIDE-BY-SIDE TEST APK: package com.veilforge.realmagent.diagnostic. Does NOT update or overwrite the permanent-key Realm AI app, so existing login remains safe, but the test app needs its own sign-in. Debug key is not the permanent production signing key. Includes server-reported inventory receipts, equipment confirmation, and combat status to diagnose invulnerability vs Realm PvP. Node/Android tests and APK checks gated publication; live Minecraft Realm gameplay not verified. No v0.15 Codex changes included." --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-v0.14.1-Diagnostic-APK
          path: |
            VEILFORGE-Realm-AI-v0.14.1-Inventory-Diagnostic.apk
            VEILFORGE-Realm-AI-v0.14.1-SHA256.txt
          retention-days: 7
          if-no-files-found: error
