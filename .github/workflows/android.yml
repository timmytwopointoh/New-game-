name: Android APK and emulator smoke test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: echoform-debug-apk, path: app/build/outputs/apk/debug/*.apk}
  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            gradle :app:assembleDebug --no-daemon
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.echoform.game/.MainActivity
            sleep 5
            adb shell screencap -p /sdcard/echoform.png
            adb pull /sdcard/echoform.png screenshot.png
      - uses: actions/upload-artifact@v4
        with: {name: emulator-screenshot, path: screenshot.png}
