name: VEILFORGE Realm AI v0.14.8 player actor ID and queue manager integration
# Final verification: correct phone queue labels, top-left Stop Bot confirmation and Android layout.
on:
  push:
    branches:
      - sandbox/realm-ai-v0148-player-session-experiment-20261031
    paths:
      - '.github/workflows/realm-ai-v0148-player-actor-queue.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install previously reviewed Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Reconstruct v0.14 source plus v0.14.8 queue, chat and phone overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 realm-ai-phone-build/prepare_v014.py "$RUNNER_TEMP/vf-queue-145"
          ROOT="$RUNNER_TEMP/vf-queue-145/veilforge_realm_v09_apk_ready"
          test -f "$ROOT/bedrock-agent/src/survival/language.js"
          test -f "$ROOT/bedrock-agent/tests/chat-ordered-queue.test.js"
          test -f "$ROOT/bedrock-agent/tests/queue-migration.test.js"
          test -f "$ROOT/bedrock-agent/tests/queue-manager.test.js"
          test -f "$ROOT/bedrock-agent/tests/player-actor-session.test.js"
          test -f "$ROOT/bedrock-agent/src/survival/player-actor-session.js"
          test -f "$ROOT/bedrock-agent/src/survival/real-player.js"
          test -f "$ROOT/bedrock-agent/tests/real-player.test.js"
          test -f "$ROOT/bedrock-agent/src/realm-chat.js"
          echo "VF_BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Run offline intent, authorized chat, ordered queue and all existing bot tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$VF_BUILD_ROOT/bedrock-agent"
          # Retain new server-authoritative equipment behavior in historical test.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/recovery.test.js')
          t=p.read_text()
          old="assert.match(s.handle('select slot 1').message,/Selected/);assert.equal(sent[1][0],'mob_equipment');assert.equal(sent[1][1].item.network_id,0)"
          new="assert.match(s.handle('select slot 1').message,/waiting for server confirmation/);assert.equal(sent.length,1);assert.equal(sent[0][0],'mob_equipment');assert.equal(sent[0][1].item.network_id,0)"
          assert t.count(old)==1
          t=t.replace(old,new)
          assert t.count('/not been received/')==1
          p.write_text(t.replace('/not been received/','/not been reported/'))
          PY
          for file in src/api.js src/realm-chat.js src/survival/language.js src/survival/command-plans.js src/survival/controller.js; do node --check "$file"; done
          npm test
          node --test tests/queue-migration.test.js tests/real-player.test.js tests/queue-manager.test.js tests/player-actor-session.test.js
      - name: Compile Android phone UI and bundled Node engine, preserving original package name
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['VF_BUILD_ROOT'])/'android-app/app/build.gradle'
          s=p.read_text()
          assert s.count('versionCode 100004')==1
          assert s.count("versionName '0.14-survival-controls'")==1
          assert s.count("buildTypes { debug { signingConfig = null } }")==1
          p.write_text(s.replace('versionCode 100004','versionCode 100010').replace("versionName '0.14-survival-controls'","versionName '0.14.6-survival-queue-recovery'"))
          PY
          (cd "$VF_BUILD_ROOT" && python3 tools/prepare_android_node.py)
          gradle -p "$VF_BUILD_ROOT/android-app" :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify unsigned preview artifact contents without trying to install or sign
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="$VF_BUILD_ROOT/android-app/app/build/outputs/apk/debug/app-debug-unsigned.apk"
          test -s "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" > package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100010'" package-report.txt
          grep -q "versionName='0.14.6-survival-queue-recovery'" package-report.txt
          unzip -t "$APK" | tail -1
          for filename in 'src/survival/language.js' 'src/survival/command-plans.js' 'src/realm-chat.js' 'src/survival/real-player.js' 'src/survival/player-actor-session.js'; do
            unzip -Z1 "$APK" | grep -Fxq "assets/nodejs-project/$filename"
          done
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          mkdir -p output
          cp "$APK" output/VEILFORGE-Realm-AI-v0.14.8-UNSIGNED-NOT-INSTALLABLE.apk
          cp package-report.txt alignment-report.txt output/
      - uses: actions/upload-artifact@v4
        with:
          name: realm-ai-v0148-player-queue-unsigned
          path: output/
          retention-days: 7
          if-no-files-found: error
