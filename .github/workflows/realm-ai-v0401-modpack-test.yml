name: Realm AI Live v0.40.1 full modded pack stack - safe APK field test
on:
  push:
    branches: [fix/realm-ai-modpack-fullstack-v0401-20261102]
    paths: ['.github/workflows/realm-ai-v0401-modpack-test.yml']
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Confirm untouched Live app identity and Nintendo authentication
        run: |
          set -euo pipefail
          ROOT=realm-ai-phone-build/realm-ai-live-v021-overlay
          grep -q "applicationId 'com.veilforge.realmagent.live'" "$ROOT/android-app/app/build.gradle"
          grep -q 'versionCode 200030' "$ROOT/android-app/app/build.gradle"
          grep -q "versionName '0.40.1-full-realm-pack-stack'" "$ROOT/android-app/app/build.gradle"
          grep -q "authTitle:'00000000441cc96b',deviceType:'Nintendo',deviceOS:12,flow:'live'" "$ROOT/bedrock-agent/src/options.js"
          grep -q "policy:'all-advertised'" "$ROOT/bedrock-agent/src/realm-packs.js"
      - name: Restore exact original Bedrock Live dependencies
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-fund --no-audit
          curl -fsSL --retry 3 --retry-all-errors 'https://github.com/timmytwopointoh/New-game-/releases/download/realm-ai-live-0395-pack-order-and-timing/Realm-AI-Live.apk' -o /tmp/previous-live.apk
          echo 'e3e8b829e1b3c7113f9a8a23fa243a74c7c0dd3aba41a036af74d01bc9affebf  /tmp/previous-live.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,shutil,pathlib
          target=pathlib.Path('node_modules');shutil.rmtree(target,ignore_errors=True);target.mkdir()
          prefix='assets/nodejs-project/node_modules/'
          count=0
          with zipfile.ZipFile('/tmp/previous-live.apk') as z:
              for item in z.infolist():
                  if not item.filename.startswith(prefix) or item.is_dir():continue
                  relative=pathlib.PurePosixPath(item.filename[len(prefix):])
                  if relative.is_absolute() or '..' in relative.parts:raise RuntimeError('Unsafe path')
                  out=target.joinpath(*relative.parts);out.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(item) as src,open(out,'wb') as dest:shutil.copyfileobj(src,dest)
                  count+=1
          assert count>=11000,count
          assert (target/'bedrock-protocol/src/client/realmJoin503Retry.js').exists()
          PY
      - name: Run all Node tests including exact nine-pack diagnostic regression
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm run check
          node --test tests/*.test.js
      - name: Restore verified Android ARM64 native runtime
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: python3 tools/fetch_native_runtime.py
      - name: Run original Android UI and service tests
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build original-identity install-over candidate (unsigned only)
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/unsigned/Realm-AI-Live-v0.40.1-UNSIGNED-SIGN-PRIVATELY.apk"
          test -s "$RUNNER_TEMP/unsigned/Realm-AI-Live-v0.40.1-UNSIGNED-SIGN-PRIVATELY.apk"
      - name: Keep unsigned main-app candidate briefly for private original-key signing
        uses: actions/upload-artifact@v4
        with:
          name: realm-ai-live-v0401-unsigned-original-id
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 2
      - name: Make temporary side-by-side Android test identity
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('android-app/app')
          p=app/'build.gradle';s=p.read_text()
          assert "applicationId 'com.veilforge.realmagent.live'" in s
          assert 'versionCode 200030' in s
          s=s.replace("applicationId 'com.veilforge.realmagent.live'","applicationId 'com.veilforge.realmagent.live.packstacktest'")
          s=s.replace('versionCode 200030','versionCode 1')
          s=s.replace("versionName '0.40.1-full-realm-pack-stack'","versionName '0.40.1-packstack-field-test'")
          p.write_text(s)
          m=app/'src/main/AndroidManifest.xml';v=m.read_text()
          assert 'android:label="Realm AI Live"' in v
          m.write_text(v.replace('android:label="Realm AI Live"','android:label="Realm AI MOD PACK TEST"'))
          PY
      - name: Build isolated modded Realm test APK
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:clean :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign test APK with temporary key (never original Live key)
        run: |
          set -euo pipefail
          export VF_TEST_PASSWORD="$(openssl rand -hex 24)"
          KEY="$RUNNER_TEMP/realm-v0401-test.p12"
          keytool -genkeypair -noprompt -alias test -keyalg RSA -keysize 3072 -validity 90 -storetype PKCS12 -keystore "$KEY" -storepass "$VF_TEST_PASSWORD" -keypass "$VF_TEST_PASSWORD" -dname 'CN=VEILFORGE Modded Realm Field Test,OU=Test Only,O=VEILFORGE,C=US'
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          INPUT=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -P 16 -f 4 "$INPUT" "$RUNNER_TEMP/modpack-aligned.apk"
          "$BT/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias test --ks-pass env:VF_TEST_PASSWORD --key-pass env:VF_TEST_PASSWORD --out Realm-AI-v0.40.1-MOD-PACK-TEST.apk "$RUNNER_TEMP/modpack-aligned.apk"
          "$BT/apksigner" verify --print-certs --verbose Realm-AI-v0.40.1-MOD-PACK-TEST.apk > certificate-report.txt
          "$BT/zipalign" -c -P 16 4 Realm-AI-v0.40.1-MOD-PACK-TEST.apk
          "$BT/aapt" dump badging Realm-AI-v0.40.1-MOD-PACK-TEST.apk > package-report.txt
          grep -q "package: name='com.veilforge.realmagent.live.packstacktest' versionCode='1'" package-report.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('Realm-AI-v0.40.1-MOD-PACK-TEST.apk') as z:
              assert z.testzip() is None
              script=z.read('assets/nodejs-project/src/realm-packs.js')
              assert b"policy:'all-advertised'" in script
              assert b"resource_pack_client_response" in script
              assert 'lib/arm64-v8a/libnode.so' in z.namelist()
              assert 'lib/arm64-v8a/libveilforge_bridge.so' in z.namelist()
          print('APK contains changed full-stack handler and ARM64 runtime')
          PY
          sha256sum Realm-AI-v0.40.1-MOD-PACK-TEST.apk > SHA256SUMS.txt
          rm -f "$KEY"
      - name: Publish public standalone APK only after tests, compile and package checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'TXT'
          v0.40.1 TEST build for modded Minecraft Bedrock Realm pack handshake.
          Reproduces the user's 9 advertised / 8 requested issue and requests all nine server-advertised packs.
          Preserves download safety and Nintendo Switch authentication profile.
          Package com.veilforge.realmagent.live.packstacktest is standalone: INSTALL ALONGSIDE original Realm AI Live; DO NOT uninstall the original app.
          Test app has its own storage and requires its own Microsoft login, and its temporary signing key cannot update the original app.
          The main versionCode 200030 original-ID package is built unsigned and must be signed privately with the existing unchanged original Live signing key before any install-over update.
          A successful live modded Realm join is not claimed until tested on the owner's phone.
          TXT
          gh release create realm-ai-live-v0401-modpack-field-test Realm-AI-v0.40.1-MOD-PACK-TEST.apk SHA256SUMS.txt package-report.txt certificate-report.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Realm AI v0.40.1 Modded Realm Full-Pack - TEST APK' --notes-file release-notes.txt

# Test assertion uses serverPackCount, matching the emitted diagnostics field.
