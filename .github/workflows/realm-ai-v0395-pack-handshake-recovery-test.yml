name: Realm AI v0.39.5 Pack Handshake Recovery - TEST APK
on:
  push:
    branches: [fix/realm-ai-pack-handshake-watchdog-v0395-20261102]
    paths: ['.github/workflows/realm-ai-v0395-pack-handshake-recovery-test.yml']
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve latest Nintendo Switch auth, Android service and identity
        run: |
          set -euo pipefail
          ROOT='realm-ai-phone-build/realm-ai-live-v021-overlay'
          BASE='6a08b36df16769f1bbfa9c783a90dbaae4c630a6'
          git diff --exit-code "$BASE" HEAD -- "$ROOT/bedrock-agent/src/options.js" "$ROOT/bedrock-agent/src/connection-diagnostics.js" "$ROOT/android-app/app/src/main/AndroidManifest.xml" "$ROOT/android-app/app/src/main/java/com/veilforge/realmagent/BotService.java"
          grep -q "applicationId 'com.veilforge.realmagent.live'" "$ROOT/android-app/app/build.gradle"
          grep -q "versionCode 200024" "$ROOT/android-app/app/build.gradle"
          echo 'Authentication profile and latest live app identity preserved.'
      - name: Test all on-device Node.js Realm pack and agent code
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-fund --no-audit
          node --test tests/*.test.js
      - name: Install verified Android ARM64 Node runtime
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: python3 tools/fetch_native_runtime.py
      - name: Test original package Android UI, startup and sanitized bug reports
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Prepare side-by-side APK identity, not a Live update
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('android-app/app')
          p=app/'build.gradle'
          s=p.read_text()
          assert "applicationId 'com.veilforge.realmagent.live'" in s
          assert 'versionCode 200024' in s
          s=s.replace("applicationId 'com.veilforge.realmagent.live'","applicationId 'com.veilforge.realmagent.live.packfix'")
          s=s.replace('versionCode 200024','versionCode 1')
          s=s.replace("versionName '0.39.5-pack-order-and-timing'","versionName '0.39.5-pack-handshake-test'")
          p.write_text(s)
          m=app/'src/main/AndroidManifest.xml'
          content=m.read_text()
          assert 'android:label="Realm AI Live"' in content
          m.write_text(content.replace('android:label="Realm AI Live"','android:label="Realm AI PACK FIX TEST"'))
          PY
      - name: Compile full Android APK
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign standalone APK with throwaway test-only key
        run: |
          set -euo pipefail
          export VF_TEST_PASSWORD="$(openssl rand -hex 24)"
          KEY="$RUNNER_TEMP/realm-packfix-test.p12"
          keytool -genkeypair -noprompt -alias test -keyalg RSA -keysize 3072 -validity 90 -storetype PKCS12 -keystore "$KEY" -storepass "$VF_TEST_PASSWORD" -keypass "$VF_TEST_PASSWORD" -dname 'CN=Realm AI Large Packs Test,OU=Test Only,O=VEILFORGE,C=US'
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          INPUT='realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$BT/zipalign" -P 16 -f 4 "$INPUT" "$RUNNER_TEMP/realm-packfix-aligned.apk"
          "$BT/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias test --ks-pass env:VF_TEST_PASSWORD --key-pass env:VF_TEST_PASSWORD --out Realm-AI-v0.39.5-PACK-FIX-TEST.apk "$RUNNER_TEMP/realm-packfix-aligned.apk"
          "$BT/apksigner" verify --print-certs --verbose Realm-AI-v0.39.5-PACK-FIX-TEST.apk > certificate-report.txt
          "$BT/zipalign" -c -P 16 4 Realm-AI-v0.39.5-PACK-FIX-TEST.apk
          "$BT/aapt" dump badging Realm-AI-v0.39.5-PACK-FIX-TEST.apk > package-report.txt
          grep -q "package: name='com.veilforge.realmagent.live.packfix' versionCode='1'" package-report.txt
          sha256sum Realm-AI-v0.39.5-PACK-FIX-TEST.apk > SHA256SUMS.txt
          rm -f "$KEY"
      - name: Publish isolated field-test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create realm-ai-live-0395-pack-handshake-fix-test Realm-AI-v0.39.5-PACK-FIX-TEST.apk SHA256SUMS.txt package-report.txt certificate-report.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Realm AI v0.39.5 Pack Handshake Fix - TEST APK' --notes 'Standalone test app Realm AI PACK FIX TEST. Existing installed com.veilforge.realmagent.live and its saved Microsoft sign-in are untouched. Preserves v0.39.5 pack-order controls, bounded CDN concurrency and required-only policy. Preserves tested free-space preflight, resumable CDN, limits and progress; fixes modern Bedrock pack-response status strings, starts a 60-second watchdog for missing server-chunk data, reports server-no-pack-data and server-pack-stalled errors without claiming downloads began. Authentication and original Live signer unchanged. Test Android package/signing key cannot update v0.38 or original Live. Real Realm behavior still requires phone testing.'
