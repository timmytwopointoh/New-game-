name: Rovekin 0.44.4 single-use Android preview APK
on:
  push:
    branches:
      - feature/rovekin-ui-v0444-integration-20261106
    paths:
      - .github/workflows/rovekin-one-time-ui-apk-20261106.yml

# Trigger is intentionally limited to the initial creation of THIS workflow.
# There is no schedule, no workflow_dispatch, and no trigger on ordinary source edits.
permissions:
  contents: write
concurrency:
  group: rovekin-one-time-preview-20261106
  cancel-in-progress: false
jobs:
  compile-and-publish:
    if: github.repository == 'timmytwopointoh/New-game-'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated Rovekin branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify selected source and Android SDK
        run: |
          set -euo pipefail
          echo "Isolated source SHA: $GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/feature/rovekin-ui-v0444-integration-20261106'
          GRADLE=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build.gradle
          grep -q "applicationId 'com.veilforge.realmagent.live'" "$GRADLE"
          grep -q 'versionCode 200076' "$GRADLE"
          grep -q "versionName '0.44.4-rovekin-private-ui-test'" "$GRADLE"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' || true
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Retrieve pinned original ARM64 runtime from previous verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .native-base
          gh release download realm-ai-live-v0419-realm-selector-diagnostics --repo "timmytwopointoh/New-game-" --pattern 'Realm-AI-Live-v0.40.19.apk' --dir .native-base
          echo 'e96e75deed3e39e2c978ad4390b4757e70173fd92a930aafd945ad5bce1d506e  .native-base/Realm-AI-Live-v0.40.19.apk' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path('.native-base/Realm-AI-Live-v0.40.19.apk')
          target=Path('realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/src/main/jniLibs/arm64-v8a')
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for name in ('libnode.so','libveilforge_bridge.so','libc++_shared.so'):
                  data=z.read('lib/arm64-v8a/'+name)
                  assert len(data)>1000,name
                  (target/name).write_bytes(data)
          print('Original native Android Node runtime restored')
          PY
      - name: Install pinned production Node dependencies
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -f node_modules/bedrock-protocol/package.json
      - name: Run Java unit tests and compile ORIGINAL full Android app source
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease
      - name: Verify original-identity unsigned APK, before creating isolated preview
        run: |
          set -euo pipefail
          mkdir -p rovekin-output
          BASE=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$BASE"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$BASE" > rovekin-output/original-package.txt
          grep -q "package: name='com.veilforge.realmagent.live' versionCode='200076'" rovekin-output/original-package.txt
          python3 - <<'PY'
          import zipfile
          p='realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for k in (
                  'lib/arm64-v8a/libnode.so',
                  'lib/arm64-v8a/libveilforge_bridge.so',
                  'assets/nodejs-project/src/mobile.js'
              ): assert k in z.namelist(), k
          print('Full original app includes real on-device Minecraft agent')
          PY
          cp "$BASE" rovekin-output/Rovekin-original-identity-200076-UNSIGNED-NOT-INSTALLABLE.apk
          sha256sum rovekin-output/Rovekin-original-identity-200076-UNSIGNED-NOT-INSTALLABLE.apk > rovekin-output/ORIGINAL-UNSIGNED-SHA256.txt
      - name: Prepare isolated Android debug preview variant without privileged tools or auto-updates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app')
          build=root/'build.gradle'
          s=build.read_text()
          original='buildTypes { debug { signingConfig = null } }'
          assert s.count(original)==1,'Unexpected Gradle debug signing configuration'
          s=s.replace(original,"buildTypes { debug { applicationIdSuffix '.rovekinpreview'; signingConfig signingConfigs.debug } }")
          build.write_text(s)
          manifest=root/'src/main/AndroidManifest.xml'
          m=manifest.read_text()
          original_authority='android:authorities="com.veilforge.realmagent.live.testlab"'
          assert m.count(original_authority)==1
          m=m.replace(original_authority,'android:authorities="com.veilforge.realmagent.live.rovekinpreview.testlab"')
          manifest.write_text(m)
          base=root/'src/main/java/com/veilforge/realmagent'
          security=base/'RovekinInternalAccess.java'
          s=security.read_text()
          # A publicly downloadable test APK must never unlock experimental developer operations.
          start=s.index('    public static RovekinFeatureContract.Authorization internalDebugBuildOnly(')
          security.write_text('package com.veilforge.realmagent;\npublic final class RovekinInternalAccess {\n  private RovekinInternalAccess() {}\n  public static RovekinFeatureContract.Authorization internalDebugBuildOnly(MainActivity activity) {return null;}\n}\n')
          service=base/'BotService.java'
          s=service.read_text()
          assert 'AppUpdater.startMonitor(this);' in s
          service.write_text(s.replace('AppUpdater.startMonitor(this);','/* Preview has no automatic release-monitor service. */'))
          host=base/'RovekinMainActivityHost.java'
          s=host.read_text()
          old='@Override public void openAppUpdates() { AppUpdater.show(activity); }'
          assert s.count(old)==1
          s=s.replace(old,'@Override public void openAppUpdates() { new android.app.AlertDialog.Builder(activity).setTitle("Rovekin preview").setMessage("This separate test app has no automatic update channel. The existing Realm AI installation is untouched.").setPositiveButton("OK",null).show(); }')
          host.write_text(s)
          print('Separate package + separate signing identity + no developer authority + no auto-update')
          PY
      - name: Compile installable side-by-side preview APK using Android debug certificate
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verify preview package, app signature and real native runtime
        run: |
          set -euo pipefail
          SRC=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/debug/app-debug.apk
          APK=rovekin-output/Rovekin-v0444-200076-INSTALLABLE-SEPARATE-PREVIEW.apk
          test -s "$SRC"
          cp "$SRC" "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" > rovekin-output/preview-package.txt
          grep -q "package: name='com.veilforge.realmagent.live.rovekinpreview' versionCode='200076'" rovekin-output/preview-package.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > rovekin-output/preview-signer.txt
          "$BT/zipalign" -c -P 16 4 "$APK"
          python3 - <<'PY'
          import zipfile
          apk='rovekin-output/Rovekin-v0444-200076-INSTALLABLE-SEPARATE-PREVIEW.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for k in ('lib/arm64-v8a/libnode.so','lib/arm64-v8a/libveilforge_bridge.so','assets/nodejs-project/src/mobile.js'):
                  assert k in z.namelist(),k
          print('Signed isolated preview APK validated')
          PY
          sha256sum "$APK" | tee rovekin-output/SHA256SUMS.txt
          sha256sum "$APK" > rovekin-output/PREVIEW-SHA256.txt
          echo 'This APK is a SEPARATE application, NOT an update to your existing Realm AI APK. Different package and debug signing key; Microsoft login must be completed separately.' > rovekin-output/README-PREVIEW-NOT-UPGRADE.txt
      - name: Upload compiled unsigned production-identity APK for future original-key signing
        uses: actions/upload-artifact@v4
        with:
          name: rovekin-original-identity-200076-UNSIGNED
          path: |
            rovekin-output/Rovekin-original-identity-200076-UNSIGNED-NOT-INSTALLABLE.apk
            rovekin-output/ORIGINAL-UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Upload installable separate preview APK
        uses: actions/upload-artifact@v4
        with:
          name: rovekin-separate-preview-200076-INSTALLABLE
          path: |
            rovekin-output/Rovekin-v0444-200076-INSTALLABLE-SEPARATE-PREVIEW.apk
            rovekin-output/SHA256SUMS.txt
            rovekin-output/README-PREVIEW-NOT-UPGRADE.txt
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
      - name: Publish one GitHub prerelease with separately installable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=rovekin-v0444-ui-side-by-side-20261106
          cat > rovekin-output/release-notes.txt <<'TXT'
          ONE-TIME Rovekin v0.44.4 (200076) animated Android UI preview.
          
          IMPORTANT: This is a separate experimental package:
          com.veilforge.realmagent.live.rovekinpreview
          It uses GitHub Android debug signing and CANNOT replace or update the original
          com.veilforge.realmagent.live installation, whose permanent private signing key
          is not available on the public GitHub runner. The existing Realm AI app, Microsoft
          session and Realm tests remain untouched. Use a separate sign-in for this preview.
          This is a prototype, not a public production release, and the sensitive developer
          console is disabled. Auto-update is disabled. Do not uninstall your original APK.
          Android compilation/tests alone do not prove successful Realm login or live actions.
          TXT
          ! gh release view "$TAG" --repo "timmytwopointoh/New-game-" >/dev/null 2>&1
          gh release create "$TAG" \
            rovekin-output/Rovekin-v0444-200076-INSTALLABLE-SEPARATE-PREVIEW.apk \
            rovekin-output/SHA256SUMS.txt \
            rovekin-output/README-PREVIEW-NOT-UPGRADE.txt \
            --target "$GITHUB_SHA" --repo "timmytwopointoh/New-game-" \
            --prerelease \
            --title "Rovekin v0.44.4 — separate-install UI preview" \
            --notes-file rovekin-output/release-notes.txt
          gh release view "$TAG" --repo "timmytwopointoh/New-game-" --json assets --jq '.assets[] | select(.name == "Rovekin-v0444-200076-INSTALLABLE-SEPARATE-PREVIEW.apk") | [.name, .size, .url] | @tsv'
