name: Realm AI Live v0.39.1 separate test APK - never replaces Live
on:
  push:
    branches: [feature/realm-ai-live-v039-retry-knowledge-20261101]
    paths: ['.github/workflows/realm-ai-live-v0391-preview-build.yml']
permissions:
  contents: write
jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify production source and prepare isolated test identity
        run: |
          set -euo pipefail
          ROOT=realm-ai-phone-build/realm-ai-live-v021-overlay
          cd "$ROOT/bedrock-agent"
          node --test tests/jump-clearance-replan-isolated.test.cjs
          npm ci --omit=dev --no-audit --no-fund
          cd ..
          python3 tools/fetch_native_runtime.py
          python3 - <<'PY'
          from pathlib import Path
          app=Path('android-app/app')
          p=app/'build.gradle'
          s=p.read_text()
          assert "applicationId 'com.veilforge.realmagent.live'" in s
          assert 'versionCode 200020' in s
          s=s.replace("applicationId 'com.veilforge.realmagent.live'","applicationId 'com.veilforge.realmagent.live.preview'")
          s=s.replace('versionCode 200020','versionCode 1')
          s=s.replace("versionName '0.39.1-jump-recovery'","versionName '0.39.1-standalone-test'")
          p.write_text(s)
          m=app/'src/main/AndroidManifest.xml'
          text=m.read_text()
          assert 'android:label="Realm AI Live"' in text
          m.write_text(text.replace('android:label="Realm AI Live"','android:label="Realm AI TEST"'))
          PY
      - name: Compile the actual standalone test APK
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Sign separate preview with a test-only ephemeral key
        run: |
          set -euo pipefail
          export VF_PREVIEW_PASS="$(openssl rand -hex 24)"
          KEY="$RUNNER_TEMP/preview-test-only.p12"
          keytool -genkeypair -noprompt -alias preview -keyalg RSA -keysize 3072 -validity 90 -storetype PKCS12 -keystore "$KEY" -storepass "$VF_PREVIEW_PASS" -keypass "$VF_PREVIEW_PASS" -dname 'CN=Realm AI Test APK,OU=Test Only,O=VEILFORGE,C=US'
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$TOOLS/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          INPUT=realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -P 16 -f 4 "$INPUT" "$RUNNER_TEMP/preview-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias preview --ks-pass env:VF_PREVIEW_PASS --key-pass env:VF_PREVIEW_PASS --out Realm-AI-v0.39.1-TEST.apk "$RUNNER_TEMP/preview-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs Realm-AI-v0.39.1-TEST.apk > certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 4 Realm-AI-v0.39.1-TEST.apk
          "$TOOLS/aapt" dump badging Realm-AI-v0.39.1-TEST.apk > package-report.txt
          grep -q "package: name='com.veilforge.realmagent.live.preview' versionCode='1'" package-report.txt
          sha256sum Realm-AI-v0.39.1-TEST.apk > SHA256SUMS.txt
          rm -f "$KEY"
      - name: Publish clearly marked standalone test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create realm-ai-live-0391-standalone-test Realm-AI-v0.39.1-TEST.apk SHA256SUMS.txt package-report.txt certificate-report.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Realm AI v0.39.1 TEST - separate app, not an update' --notes 'Signed side-by-side test ONLY. Does NOT replace com.veilforge.realmagent.live v0.38 and does NOT share that apps saved Microsoft sign-in. Stop the existing bot before connecting this second app; test in a disposable Survival Realm. Test signing identity is temporary and cannot update the production app. Changes: bounded jump recovery for Follow and Roam, shallow-water routing and knowledge lookups. Full signed install-over update still requires the original Live private signing key.'
