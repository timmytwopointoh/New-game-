name: Publish requested exact same-key Realm v0.14 test APK
on:
  push:
    branches:
      - sandbox/realm-ai-v013-adaptive-recovery-20261031
    paths:
      - 'realm-ai-phone-build/v014-publish-requests/**'
permissions:
  contents: write
concurrency:
  group: realm-v014-requested-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct only the exact locally verified public signed bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/timmytwopointoh/New-game-/releases/download/veilforge-realm-ai-v013-adaptive-preview/VEILFORGE-Realm-AI-v0.13-Adaptive-Permanent.apk' -o public-base.apk
          python3 realm-ai-phone-build/materialize_v014_apk.py public-base.apk realm-ai-phone-build/v014-public-apk-recipe.json.xz.b64 VEILFORGE-Realm-AI-v0.14-Survival-Controls-Permanent.apk
          sha256sum -c realm-ai-phone-build/v014-publication/VEILFORGE-Realm-AI-v0.14-SHA256.txt
      - name: Select the same Android verification tools used locally
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Verify signature, update identity and alignment before publication
        shell: bash
        run: |
          set -euo pipefail
          APK='VEILFORGE-Realm-AI-v0.14-Survival-Controls-Permanent.apk'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$SDK/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          TOOLS="$(dirname "$SIGNER")"
          "$SIGNER" verify --verbose --print-certs "$APK" > certificate-report.txt
          cat certificate-report.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: b5d275706b574eea53d6497a3a65542542b5db0e0e57f4e307e8ed17cf24f995' certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          tail -n 1 alignment-report.txt
          "$TOOLS/aapt" dump badging "$APK" > package-report.txt
          head -n 1 package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100004'" package-report.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('VEILFORGE-Realm-AI-v0.14-Survival-Controls-Permanent.apk') as z:
              assert z.testzip() is None
              assert all(not n.endswith(('.p12','.jks','.node')) and 'private/' not in n and 'signing-password' not in n for n in z.namelist())
              for name in ['lib/arm64-v8a/libnode.so','lib/arm64-v8a/libveilforge_bridge.so','assets/nodejs-project/src/survival/command-catalog.json']:
                  assert name in z.namelist()
          PY
      - name: Publish the requested test download without accessing any signing secret
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='veilforge-realm-ai-v014-survival-controls-preview'
          REPO="$GITHUB_REPOSITORY"
          APK='VEILFORGE-Realm-AI-v0.14-Survival-Controls-Permanent.apk'
          NOTES='realm-ai-phone-build/v014-publication/release-notes.md'
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" realm-ai-phone-build/v014-publication/VEILFORGE-Realm-AI-v0.14-SHA256.txt certificate-report.txt realm-ai-phone-build/v014-publication/verification.json --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --title 'VEILFORGE Realm AI v0.14 — Survival Controls Test' --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" realm-ai-phone-build/v014-publication/VEILFORGE-Realm-AI-v0.14-SHA256.txt certificate-report.txt realm-ai-phone-build/v014-publication/verification.json --repo "$REPO" --target bf62b84a2a2daeda543b924bab4e897bd3cfd36c --prerelease --title 'VEILFORGE Realm AI v0.14 — Survival Controls Test' --notes-file "$NOTES"
          fi
