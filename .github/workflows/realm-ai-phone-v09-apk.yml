name: VEILFORGE Realm AI v0.9 Standalone APK — Peks-proven Android pipeline
on:
  push:
    branches:
      - sandbox/realm-ai-android-only-20261030
    paths:
      - 'realm-ai-phone-build/source-v09.tar.xz.b64'
      - '.github/workflows/realm-ai-phone-v09-apk.yml'
permissions:
  contents: write
concurrency:
  group: veilforge-realm-v09-isolated-peks-proven-build
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify cleaned v0.9 source archive and extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vf-phone-build
          base64 --decode realm-ai-phone-build/source-v09.tar.xz.b64 > source-v09.tar.xz
          echo '3f1a70bf640d9bfef51169985be871fb55c299c7cd0fe78392aba3be46b1fac5  source-v09.tar.xz' | sha256sum -c -
          tar -xJf source-v09.tar.xz -C .vf-phone-build --no-same-owner
          test -f .vf-phone-build/veilforge_realm_v09_apk_ready/bedrock-agent/src/mobile.js
          test -f .vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/src/main/java/com/veilforge/realmagent/BotService.java
          if grep -riEq 'mraitousir|slenderbender' .vf-phone-build/; then
            echo 'STOP: account-specific text found in source' >&2
            exit 1
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 24 (build-time tests and npm only)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35, NDK 28, CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Run existing 93 Node tests and install JS runtime dependencies
        working-directory: .vf-phone-build/veilforge_realm_v09_apk_ready/bedrock-agent
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -f node_modules/bedrock-protocol/package.json
          echo 'Inspect bundled native addons before Android packaging'
          find node_modules -type f -name '*.node' -print | sort
          find node_modules -type f -name '*.node' -print | grep -Ev '^node_modules/(raknet-native|raknet-node)/' > /tmp/vf-unexpected-native || true
          if test -s /tmp/vf-unexpected-native; then
            echo 'STOP: unexpected native modules require an Android-compatible build:' >&2
            cat /tmp/vf-unexpected-native >&2
            exit 1
          fi
          find node_modules/raknet-native node_modules/raknet-node -type f -name '*.node' -delete 2>/dev/null || true
          node --input-type=module -e "import('bedrock-protocol').then(m=>{if(typeof m.default?.createClient!=='function') throw Error('Bedrock client missing');console.log('Pure JS Bedrock import OK')})"
          test -z "$(find node_modules -type f -name '*.node' -print -quit)"
          echo 'No Linux native addons will be bundled in the Android APK'
          echo 'Remove redundant gzipped copies that Android merges onto existing asset names'
          find node_modules -type f -name '*.gz' -print0 | while IFS= read -r -d '' file; do
            if test -f "${file%.gz}"; then
              echo "Excluding duplicate Android asset: $file"
              rm -f "$file"
            fi
          done
          echo 'Prune non-runtime prismarine-nbt sample data that Android asset merger treats as duplicate'
          rm -rf node_modules/prismarine-nbt/sample
          test ! -e node_modules/prismarine-nbt/sample/bigtest.nbt
          test ! -e node_modules/prismarine-nbt/sample/bigtest.nbt.gz
      - name: Acquire checksum-verified Android 16 KB Node native runtime
        working-directory: .vf-phone-build/veilforge_realm_v09_apk_ready
        run: python3 tools/prepare_android_node.py
      - name: Select C++20 for Node.js 24 native headers
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app'
          sed -i 's/-std=c++17 -fexceptions/-std=c++20 -fexceptions/' "$ROOT/build.gradle"
          sed -i 's/cxx_std_17/cxx_std_20/' "$ROOT/CMakeLists.txt"
          grep -q -- '-std=c++20 -fexceptions' "$ROOT/build.gradle"
          grep -q 'cxx_std_20' "$ROOT/CMakeLists.txt"
          echo 'Avoid duplicate libnode/libc++ packaging: AGP CMake imported targets own the native outputs'
          sed -i "/sourceSets.main.jniLibs.srcDir 'libnode\\/bin'/d" "$ROOT/build.gradle"
          if grep -q "sourceSets.main.jniLibs.srcDir 'libnode/bin'" "$ROOT/build.gradle"; then
            echo 'STOP: duplicate JNI source still configured' >&2; exit 1
          fi
      - name: Compile signed Android debug APK
        shell: bash
        run: gradle -p .vf-phone-build/veilforge_realm_v09_apk_ready/android-app :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: APK integrity, native libs, embedded bot and signature verification
        shell: bash
        run: |
          set -euo pipefail
          APK='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tail -n1
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libveilforge_bridge.so$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/mobile.js$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/node_modules/bedrock-protocol/package.json$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"
      - name: Publish Peks-style verified APK to a private GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/build/outputs/apk/debug/app-debug.apk'
          cp "$APK" VEILFORGE-Realm-AI-v0.9-Standalone-debug.apk
          sha256sum VEILFORGE-Realm-AI-v0.9-Standalone-debug.apk > VEILFORGE-Realm-AI-v0.9-SHA256.txt
          TAG="veilforge-realm-ai-v09-standalone-preview"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" VEILFORGE-Realm-AI-v0.9-Standalone-debug.apk VEILFORGE-Realm-AI-v0.9-SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" VEILFORGE-Realm-AI-v0.9-Standalone-debug.apk VEILFORGE-Realm-AI-v0.9-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "VEILFORGE Realm AI v0.9 - Standalone Android PREVIEW" \
              --notes "Debug-signed Android 16 ARM64 preview. Source archive SHA256 gated, Node Android runtime checksum/ELF alignment gated, APK signature and native payload verified. NO actual Android device install, Microsoft sign-in, Realm connection, or gameplay success is claimed. Use official Microsoft device-code login only. Never enter account credentials in GitHub." --prerelease
          fi
      - name: Upload validated debug APK for 2 days
        uses: actions/upload-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-v0.9-Standalone-APK
          path: .vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
          if-no-files-found: error
