          unzip -Z1 "$UNSIGNED" | grep -q '^assets/nodejs-project/src/survival/inventory-evidence.js$'
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$UNSIGNED" > alignment-report.txt
          # This is NOT signed and must never be presented as an Android-installable update.
          mkdir -p signing-kit
          cp "$UNSIGNED" signing-kit/Realm-AI-v0.14.4-unsigned.apk
          sha256sum signing-kit/Realm-AI-v0.14.4-unsigned.apk > signing-kit/Realm-AI-v0.14.4-unsigned.SHA256.txt
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" signing-kit/apksigner.jar
          cp realm-ai-phone-build/v0144-signing-kit/sign-v0144-original-key.ps1 signing-kit/
          cp realm-ai-phone-build/v0144-signing-kit/README-FIRST.txt signing-kit/
          cp realm-ai-phone-build/v0144-signing-kit/START-HERE.cmd signing-kit/
          (cd signing-kit && zip -q -9 ../VEILFORGE-Realm-AI-v0144-Sign-On-PC.zip ./*)
          unzip -t VEILFORGE-Realm-AI-v0144-Sign-On-PC.zip | tail -1
      - name: Publish verified ORIGINAL-PACKAGE signing kit (not installable until locally signed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create 'veilforge-realm-ai-v0144-signing-kit' VEILFORGE-Realm-AI-v0144-Sign-On-PC.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VEILFORGE Realm AI v0.14.4 — Player Identity Update Kit" --notes "IMPORTANT: This ZIP contains a verified unsigned ORIGINAL-PACKAGE APK (com.veilforge.realmagent, versionCode 100006), Android apksigner.jar, and a Windows signer. It is NOT directly installable. Extract on the PC where you kept the exact original realm-ai-update.p12 and run START-HERE.cmd, enter the original password, and use the resulting signed VEILFORGE-Realm-AI-v0.14.4-Permanent-Update.apk to update over v0.14 without uninstalling or losing Microsoft login. The script refuses a wrong certificate; no signing private key is uploaded. Existing permanent cert must be B5D275706B574EEA53D6497A3A65542542B5DB0E0E57F4E307E8ED17CF24F995. Signed hosted workflow is also ready but could not run because original key GitHub Actions secrets are absent. Includes real Bedrock player actor, own mode and ability verification, inventory, Survival, aim and server-input diagnostics. Live Realm testing required." --prerelease
