name: VEILFORGE Realm AI v0.14.4 authentic player update kit
on:
  push:
    branches:
      - sandbox/realm-ai-v0144-real-player-identity-20261031
    paths:
      - '.github/workflows/realm-ai-v0144-player-identity-update-kit.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Reconstruct retained source and preserve original package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 realm-ai-phone-build/prepare_v014.py "$RUNNER_TEMP/vf-player-144"
          ROOT="$RUNNER_TEMP/vf-player-144/veilforge_realm_v09_apk_ready"
          test -f "$ROOT/bedrock-agent/src/survival/real-player.js"
          test -f "$ROOT/bedrock-agent/tests/real-player.test.js"
          test -f "$ROOT/bedrock-agent/src/survival/control-input.js"
          echo "VF_BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Run original regression tests and new Bedrock player identity tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$VF_BUILD_ROOT/bedrock-agent"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/recovery.test.js')
          text=p.read_text()
          old="assert.match(s.handle('select slot 1').message,/Selected/);assert.equal(sent[1][0],'mob_equipment');assert.equal(sent[1][1].item.network_id,0)"
          new="assert.match(s.handle('select slot 1').message,/waiting for server confirmation/);assert.equal(sent.length,1);assert.equal(sent[0][0],'mob_equipment');assert.equal(sent[0][1].item.network_id,0)"
          assert text.count(old)==1,'Upstream equipment regression must be reviewed'
          text=text.replace(old,new)
          assert text.count('/not been received/')==1,'Unknown slot regression must be reviewed'
          p.write_text(text.replace('/not been received/','/not been reported/'))
          PY
          node --check src/survival/real-player.js
          node --check src/survival/world.js
          node --check src/survival/controller.js
          npm test
          node --test tests/real-player.test.js
      - name: Compile unsigned same-package Android APK (never substitute a debug signing key)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['VF_BUILD_ROOT'])/'android-app/app/build.gradle'
          s=p.read_text()
          assert s.count('versionCode 100004')==1
          assert s.count("versionName '0.14-survival-controls'")==1
          assert s.count("buildTypes { debug { signingConfig = null } }")==1
          s=s.replace('versionCode 100004','versionCode 100006').replace("versionName '0.14-survival-controls'","versionName '0.14.4-real-player-identity'")
          p.write_text(s)
          PY
          (cd "$VF_BUILD_ROOT" && python3 tools/prepare_android_node.py)
          gradle -p "$VF_BUILD_ROOT/android-app" :app:assembleDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify real player source, Android native runtime, original ID and build offline signing kit
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="$VF_BUILD_ROOT/android-app/app/build/outputs/apk/debug/app-debug-unsigned.apk"
          test -s "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" > package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100006'" package-report.txt
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/survival/real-player.js$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/survival/control-input.js$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/survival/inventory-evidence.js$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libveilforge_bridge.so$'
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          mkdir -p signing-kit
          cp "$APK" signing-kit/Realm-AI-v0.14.4-unsigned.apk
          (cd signing-kit && sha256sum Realm-AI-v0.14.4-unsigned.apk > Realm-AI-v0.14.4-unsigned.SHA256.txt)
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" signing-kit/apksigner.jar
          cp realm-ai-phone-build/v0144-signing-kit/sign-v0144-original-key.ps1 signing-kit/
          cp realm-ai-phone-build/v0144-signing-kit/README-FIRST.txt signing-kit/
          cp realm-ai-phone-build/v0144-signing-kit/START-HERE.cmd signing-kit/
          (cd signing-kit && zip -q -9 ../VEILFORGE-Realm-AI-v0144-Update-Kit.zip ./*)
          unzip -t VEILFORGE-Realm-AI-v0144-Update-Kit.zip | tail -1
      - name: Publish original-package update signing kit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create veilforge-realm-ai-v0144-player-update-kit VEILFORGE-Realm-AI-v0144-Update-Kit.zip package-report.txt alignment-report.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VEILFORGE Realm AI v0.14.4 — Real Player Update Kit" --notes "Build and original package ID verified. This ZIP contains an unsigned APK that MUST be signed using the EXISTING private realm-ai-update.p12 key on the owner's PC. It is NOT directly installable. Extract the ZIP and run START-HERE.cmd using the ORIGINAL key and password; the script pins the signing certificate SHA256 to B5D275706B574EEA53D6497A3A65542542B5DB0E0E57F4E307E8ED17CF24F995, and produces VEILFORGE-Realm-AI-v0.14.4-Permanent-Update.apk. Do not uninstall your current original-package app. Package com.veilforge.realmagent, versionCode 100006. Adds actual Bedrock player actor identity evidence, server game mode decoding and diagnostics, and correct silent-movement wording. Authenticated Bedrock player is not a custom mob. Live Realm behavior remains unverified." --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-v0.14.4-Update-Kit
          path: VEILFORGE-Realm-AI-v0144-Update-Kit.zip
          retention-days: 7
          if-no-files-found: error
