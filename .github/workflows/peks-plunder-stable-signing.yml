name: Pek's Plunder stable Android updates (TEST signing)
on:
  push:
    branches: [feature/peks-plunder-persistent-signing-v091]
    paths:
      - 'pecks-cove-capers/**'
      - '.github/workflows/peks-plunder-stable-signing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peks-plunder-persistent-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore and verify persistent test signing key
        env:
          PEKS_TEST_SIGNING_BUNDLE: ${{ secrets.PEKS_TEST_SIGNING_BUNDLE }}
        run: python3 pecks-cove-capers/scripts/restore_test_signing.py
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Validate source and task progression
        run: |
          node --check pecks-cove-capers/web/game.js
          node pecks-cove-capers/test_logic.cjs
      - name: Assemble and verify Android APK
        working-directory: pecks-cove-capers/android
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Peks-Plunder-v091-PERSISTENT-TEST-SIGNING-APK
          path: pecks-cove-capers/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
