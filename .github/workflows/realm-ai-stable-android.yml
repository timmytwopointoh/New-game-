name: VEILFORGE Realm AI permanent signing and update releases
on:
  push:
    branches:
      - sandbox/realm-ai-stable-signing-20261030
    paths:
      - 'realm-ai-phone-build/stable-build-requests/**'
permissions:
  contents: write
concurrency:
  group: veilforge-realm-ai-stable-signing
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify cleaned v0.9 source archive and extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vf-phone-build
          base64 --decode realm-ai-phone-build/source-v09.tar.xz.b64 > source-v09.tar.xz
          echo '3f1a70bf640d9bfef51169985be871fb55c299c7cd0fe78392aba3be46b1fac5  source-v09.tar.xz' | sha256sum -c -
          tar -xJf source-v09.tar.xz -C .vf-phone-build --no-same-owner
          test -f .vf-phone-build/veilforge_realm_v09_apk_ready/bedrock-agent/src/mobile.js
          test -f .vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/src/main/java/com/veilforge/realmagent/BotService.java
          if grep -riEq 'mraitousir|slenderbender' .vf-phone-build/; then
            echo 'STOP: account-specific text found in source' >&2
            exit 1
          fi
      - name: Keep the Microsoft sign-in code visible and copyable in the app
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app'
          python3 realm-ai-phone-build/patch_auth_ui.py "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
          sed -i "s/versionCode 9/versionCode 10/" "$ROOT/build.gradle"
          sed -i "s/0.9.0-phone-prototype/0.9.1-signin-code/" "$ROOT/build.gradle"
          grep -q 'MICROSOFT CODE:' "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
          grep -q 'Copy Microsoft sign-in code' "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
          grep -q 'versionCode 10' "$ROOT/build.gradle"
      - name: Show authentication state and Realm discovery / join failures (v0.9.2)
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          ROOT="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_realm_status_v092.py "$BASE"
          sed -i 's/versionCode 10/versionCode 11/' "$ROOT/build.gradle"
          sed -i 's/0.9.1-signin-code/0.9.2-realm-diagnostics/' "$ROOT/build.gradle"
          node --check "$BASE/bedrock-agent/src/connection.js"
          grep -q 'versionCode 11' "$ROOT/build.gradle"
          grep -q "realm-selecting" "$BASE/bedrock-agent/src/connection.js"
          grep -q 'Realm error:' "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
      - name: Add validated Realm resource-pack support
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          base64 --decode realm-ai-phone-build/v093-pack-overlay.tar.xz.b64 > "$RUNNER_TEMP/v093-pack-overlay.tar.xz"
          echo 'ea9771fe3a29fbf38f196b4affd8606f276ce91cce84be86d5a5823db45b9d98  '"$RUNNER_TEMP/v093-pack-overlay.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/v093-pack-overlay.tar.xz" -C "$BASE" --no-same-owner
          # Normalize Java token spacing exactly as in the successful v0.9.3 APK build.
          sed -i 's/lastError", ""/lastError",""/' "$BASE/tools/apply-pack-support.py"
          python3 "$BASE/tools/apply-pack-support.py" "$BASE"
          (cd "$BASE/bedrock-agent" && node --test tests/resource-packs.test.js)
          node --check "$BASE/bedrock-agent/src/connection.js"
          sed -i 's/versionCode 11/versionCode 12/;s/0.9.2-realm-diagnostics/0.9.3-pack-support/' "$APP/build.gradle"
          grep -q 'attachRealmPacks' "$BASE/bedrock-agent/src/connection.js"
      - name: Record actual server kicks and last join stage
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          python3 realm-ai-phone-build/patch_disconnect_v094.py "$BASE"
          node --check "$BASE/bedrock-agent/src/connection.js"
          grep -q "client.on('kick'" "$BASE/bedrock-agent/src/connection.js"
          grep -q 'Realm error (' "$BASE/android-app/app/src/main/java/com/veilforge/realmagent/MainActivity.java"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 24 (build-time tests and npm only)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35, NDK 28, CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Run 98 bot tests and install Android-compatible JS dependencies
        working-directory: .vf-phone-build/veilforge_realm_v09_apk_ready/bedrock-agent
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -f node_modules/bedrock-protocol/package.json
          echo 'Inspect bundled native addons before Android packaging'
          find node_modules -type f -name '*.node' -print | sort
          find node_modules -type f -name '*.node' -print | grep -Ev '^node_modules/(raknet-native|raknet-node)/' > /tmp/vf-unexpected-native || true
          if test -s /tmp/vf-unexpected-native; then
            echo 'STOP: unexpected native modules require an Android-compatible build:' >&2
            cat /tmp/vf-unexpected-native >&2
            exit 1
          fi
          find node_modules/raknet-native node_modules/raknet-node -type f -name '*.node' -delete 2>/dev/null || true
          node --input-type=module -e "import('bedrock-protocol').then(m=>{if(typeof m.default?.createClient!=='function') throw Error('Bedrock client missing');console.log('Pure JS Bedrock import OK')})"
          test -z "$(find node_modules -type f -name '*.node' -print -quit)"
          echo 'No Linux native addons will be bundled in the Android APK'
          echo 'Remove redundant gzipped copies that Android merges onto existing asset names'
          find node_modules -type f -name '*.gz' -print0 | while IFS= read -r -d '' file; do
            if test -f "${file%.gz}"; then
              echo "Excluding duplicate Android asset: $file"
              rm -f "$file"
            fi
          done
          echo 'Prune non-runtime prismarine-nbt sample data that Android asset merger treats as duplicate'
          rm -rf node_modules/prismarine-nbt/sample
          test ! -e node_modules/prismarine-nbt/sample/bigtest.nbt
          test ! -e node_modules/prismarine-nbt/sample/bigtest.nbt.gz
      - name: Acquire checksum-verified Android 16 KB Node native runtime
        working-directory: .vf-phone-build/veilforge_realm_v09_apk_ready
        run: python3 tools/prepare_android_node.py
      - name: Select C++20 for Node.js 24 native headers
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app'
          sed -i 's/-std=c++17 -fexceptions/-std=c++20 -fexceptions/' "$ROOT/build.gradle"
          sed -i 's/cxx_std_17/cxx_std_20/' "$ROOT/CMakeLists.txt"
          grep -q -- '-std=c++20 -fexceptions' "$ROOT/build.gradle"
          grep -q 'cxx_std_20' "$ROOT/CMakeLists.txt"
          echo 'Avoid duplicate libnode/libc++ packaging: AGP CMake imported targets own the native outputs'
          sed -i "/sourceSets.main.jniLibs.srcDir 'libnode\\/bin'/d" "$ROOT/build.gradle"
          if grep -q "sourceSets.main.jniLibs.srcDir 'libnode/bin'" "$ROOT/build.gradle"; then
            echo 'STOP: duplicate JNI source still configured' >&2; exit 1
          fi
      - name: Build and verify permanently signed Android release APK
        shell: bash
        env:
          VF_KEYSTORE_B64: ${{ secrets.VF_ANDROID_KEYSTORE_B64 }}
          VF_PASSWORD_B64: ${{ secrets.VF_ANDROID_PASSWORD_B64 }}
          VF_EXPECTED_CERT: ${{ vars.VF_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if test -z "$VF_KEYSTORE_B64" || test -z "$VF_PASSWORD_B64" || test -z "$VF_EXPECTED_CERT"; then
            echo 'STOP: permanent signing secrets/fingerprint missing. Run setup-stable-signing.ps1 on your PC.' >&2
            exit 1
          fi
          umask 077
          export VF_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/realm-ai-permanent.p12"
          printf '%s' "$VF_KEYSTORE_B64" | base64 --decode > "$VF_ANDROID_KEYSTORE_FILE"
          export VF_ANDROID_STORE_PASSWORD="$(printf '%s' "$VF_PASSWORD_B64" | base64 --decode)"
          export VF_ANDROID_KEY_PASSWORD="$VF_ANDROID_STORE_PASSWORD"
          export VF_ANDROID_KEY_ALIAS='realm-ai-update'
          unset VF_KEYSTORE_B64 VF_PASSWORD_B64
          trap 'rm -f "$VF_ANDROID_KEYSTORE_FILE"' EXIT
          test -s "$VF_ANDROID_KEYSTORE_FILE"
          CERT="$(keytool -list -v -storetype PKCS12 -keystore "$VF_ANDROID_KEYSTORE_FILE" -storepass "$VF_ANDROID_STORE_PASSWORD" -alias "$VF_ANDROID_KEY_ALIAS" | sed -nE 's/.*SHA256: ([0-9A-F:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT"
          EXPECTED="$(printf '%s' "$VF_EXPECTED_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$CERT" = "$EXPECTED" || { echo 'STOP: permanent signing certificate changed unexpectedly' >&2; exit 1; }
          APP='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app'
          VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          python3 realm-ai-phone-build/configure_stable_signing.py "$APP/build.gradle" "$VERSION_CODE"
          gradle -p .vf-phone-build/veilforge_realm_v09_apk_ready/android-app :app:assembleRelease --no-daemon --max-workers=2 --stacktrace
          APK="$APP/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libveilforge_bridge.so$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/mobile.js$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/realm-packs.js$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          REPORT="$("$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$REPORT" | sed -nE 's/.*Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+).*/\1/p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$CERT" || { echo 'STOP: APK signer does not match pinned signing certificate' >&2; exit 1; }
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.veilforge.realmagent' versionCode='$VERSION_CODE'"
          cp "$APK" "VEILFORGE-Realm-AI-Stable-$GITHUB_RUN_NUMBER.apk"
          sha256sum "VEILFORGE-Realm-AI-Stable-$GITHUB_RUN_NUMBER.apk" > "VEILFORGE-Realm-AI-Stable-$GITHUB_RUN_NUMBER-SHA256.txt"
      - name: Publish APK as permanent-key update baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="veilforge-realm-ai-stable-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" "VEILFORGE-Realm-AI-Stable-$GITHUB_RUN_NUMBER.apk" "VEILFORGE-Realm-AI-Stable-$GITHUB_RUN_NUMBER-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VEILFORGE Realm AI Stable Signed Diagnostic Update $GITHUB_RUN_NUMBER" \
            --notes "Stable signing certificate pinned and verified. Earlier debug-signed versions may require one final uninstall; all later stable-signed updates keep app data when installed over a previous stable APK. Pack handling is experimental; live Realm joining is not yet verified." --prerelease
      - name: Upload signed APK artifact for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-Stable-${{ github.run_number }}
          path: VEILFORGE-Realm-AI-Stable-*.apk
          retention-days: 7
          if-no-files-found: error
