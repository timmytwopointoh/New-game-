name: VEILFORGE Realm AI v0.13 Adaptive Follow and Recovery APK
on:
  push:
    branches:
      - sandbox/realm-ai-v013-adaptive-recovery-20261031
    paths:
      - '.github/workflows/realm-ai-v013-apk.yml'
permissions:
  contents: write
concurrency:
  group: veilforge-realm-v013-adaptive-build
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify cleaned v0.9 source archive and extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vf-phone-build
          base64 --decode realm-ai-phone-build/source-v09.tar.xz.b64 > source-v09.tar.xz
          echo '3f1a70bf640d9bfef51169985be871fb55c299c7cd0fe78392aba3be46b1fac5  source-v09.tar.xz' | sha256sum -c -
          tar -xJf source-v09.tar.xz -C .vf-phone-build --no-same-owner
          test -f .vf-phone-build/veilforge_realm_v09_apk_ready/bedrock-agent/src/mobile.js
          test -f .vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/src/main/java/com/veilforge/realmagent/BotService.java
          if grep -riEq 'mraitousir|slenderbender' .vf-phone-build/; then
            echo 'STOP: account-specific text found in source' >&2
            exit 1
          fi
      - name: Keep the Microsoft sign-in code visible and copyable in the app
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app'
          python3 realm-ai-phone-build/patch_auth_ui.py "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
          sed -i "s/versionCode 9/versionCode 10/" "$ROOT/build.gradle"
          sed -i "s/0.9.0-phone-prototype/0.9.1-signin-code/" "$ROOT/build.gradle"
          grep -q 'MICROSOFT CODE:' "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
          grep -q 'Copy Microsoft sign-in code' "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
          grep -q 'versionCode 10' "$ROOT/build.gradle"
      - name: Show authentication state and Realm discovery / join failures (v0.9.2)
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          ROOT="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_realm_status_v092.py "$BASE"
          sed -i 's/versionCode 10/versionCode 11/' "$ROOT/build.gradle"
          sed -i 's/0.9.1-signin-code/0.9.2-realm-diagnostics/' "$ROOT/build.gradle"
          node --check "$BASE/bedrock-agent/src/connection.js"
          grep -q 'versionCode 11' "$ROOT/build.gradle"
          grep -q "realm-selecting" "$BASE/bedrock-agent/src/connection.js"
          grep -q 'Realm error:' "$ROOT/src/main/java/com/veilforge/realmagent/MainActivity.java"
      - name: Integrate tested v0.9.3 Realm pack support
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          ROOT="$BASE/android-app/app"
          base64 --decode realm-ai-phone-build/v093-pack-overlay.tar.xz.b64 > v093-pack-overlay.tar.xz
          echo 'ea9771fe3a29fbf38f196b4affd8606f276ce91cce84be86d5a5823db45b9d98  v093-pack-overlay.tar.xz' | sha256sum -c -
          tar -xJf v093-pack-overlay.tar.xz -C "$BASE" --no-same-owner
          # Normalize v0.9.2 Java formatting before running the strict, reviewed patch.
          sed -i 's/lastError", ""/lastError",""/' "$BASE/tools/apply-pack-support.py"
          python3 "$BASE/tools/apply-pack-support.py" "$BASE"
          node --check "$BASE/bedrock-agent/src/realm-packs.js"
          node --check "$BASE/bedrock-agent/src/connection.js"
          (cd "$BASE/bedrock-agent" && node --test tests/resource-packs.test.js)
          sed -i 's/versionCode 11/versionCode 12/' "$ROOT/build.gradle"
          sed -i 's/0.9.2-realm-diagnostics/0.9.3-pack-support/' "$ROOT/build.gradle"
          grep -q 'versionCode 12' "$ROOT/build.gradle"
          grep -q 'attachRealmPacks' "$BASE/bedrock-agent/src/connection.js"
          grep -q 'resource_pack_chunk_request' "$BASE/bedrock-agent/src/realm-packs.js"
      - name: Show last Realm join stage and actual server kick reason (v0.9.4)
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_disconnect_v094.py "$BASE"
          sed -i 's/versionCode 12/versionCode 13/;s/0.9.3-pack-support/0.9.4-join-diagnostics/' "$APP/build.gradle"
          node --check "$BASE/bedrock-agent/src/connection.js"
          grep -q "client.on('kick'" "$BASE/bedrock-agent/src/connection.js"
          grep -q "lastPhase:this.lastPhase" "$BASE/bedrock-agent/src/connection.js"
          grep -q 'versionCode 13' "$APP/build.gradle"
          grep -q 'Realm error (' "$APP/src/main/java/com/veilforge/realmagent/MainActivity.java"
      - name: Match official 1.26.60 resource pack response text
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_pack_response_v095.py "$BASE"
          sed -i 's/versionCode 13/versionCode 14/;s/0.9.4-join-diagnostics/0.9.5-pack-protocol/' "$APP/build.gradle"
          node --check "$BASE/bedrock-agent/src/realm-packs.js"
          grep -q "response_status_name:(" "$BASE/bedrock-agent/src/realm-packs.js"
          grep -q 'versionCode 14' "$APP/build.gradle"
      - name: Add HTTPS CDN pack downloads and safe cached-session APK code refresh
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_cdn_v096.py "$BASE"
          cp realm-ai-phone-build/v096-cdn-tests.test.js "$BASE/bedrock-agent/tests/cdn-packs.test.js"
          sed -i 's/versionCode 14/versionCode 15/;s/0.9.5-pack-protocol/0.9.6-cdn-support/' "$APP/build.gradle"
          node --check "$BASE/bedrock-agent/src/cdn-download.js"
          node --check "$BASE/bedrock-agent/src/realm-packs.js"
          (cd "$BASE/bedrock-agent" && node --test tests/cdn-packs.test.js tests/resource-packs.test.js)
          grep -q 'asset_bundle_version' "$APP/src/main/java/com/veilforge/realmagent/BotService.java"
          grep -q 'versionCode 15' "$APP/build.gradle"
      - name: Diagnose pack-wait timing and raw transport closure (v0.9.7)
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_pack_wait_v097.py "$BASE"
          sed -i 's/versionCode 15/versionCode 16/;s/0.9.6-cdn-support/0.9.7-pack-timing/' "$APP/build.gradle"
          node --check "$BASE/bedrock-agent/src/connection.js"
          grep -q "packWaitSeconds:" "$BASE/bedrock-agent/src/connection.js"
          grep -q "packHeadersReceived" "$BASE/bedrock-agent/src/connection.js"
          grep -q "Requested Realm packs" "$APP/src/main/java/com/veilforge/realmagent/MainActivity.java"
          grep -q 'versionCode 16' "$APP/build.gradle"
      - name: Show Realm join 503 retry status, preserve Microsoft session
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          python3 realm-ai-phone-build/patch_join_503_status_v098.py "$BASE"
          sed -i 's/versionCode 16/versionCode 17/;s/0.9.7-pack-timing/0.9.8-join-retries/' "$APP/build.gradle"
          node --check "$BASE/bedrock-agent/src/connection.js"
          grep -q "onRealmJoinRetry" "$BASE/bedrock-agent/src/connection.js"
          grep -q 'versionCode 17' "$APP/build.gradle"
      - name: Increment version for exclusive pack handler (v0.9.9)
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          APP="$BASE/android-app/app"
          sed -i 's/versionCode 17/versionCode 18/;s/0.9.8-join-retries/0.9.9-one-pack-handler/' "$APP/build.gradle"
          grep -q 'versionCode 18' "$APP/build.gradle"
      - name: Apply adaptive follow, server feedback, jump and mining source
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          base64 --decode realm-ai-phone-build/v013-adaptive-overlay.tar.xz.b64 > "$RUNNER_TEMP/v013-overlay.tar.xz"
          echo 'db22b370489101c3f9b64e8cc046031d482f9099d441d5130aab6af2cec5baf5  '"$RUNNER_TEMP/v013-overlay.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/v013-overlay.tar.xz" -C "$BASE" --no-same-owner
          node --check "$BASE/bedrock-agent/src/connection.js"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 24 (build-time tests and npm only)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35, NDK 28, CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install runtime dependencies and run 140 regression tests
        working-directory: .vf-phone-build/veilforge_realm_v09_apk_ready/bedrock-agent
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm test
          test -f node_modules/bedrock-protocol/package.json
          echo 'Inspect bundled native addons before Android packaging'
          find node_modules -type f -name '*.node' -print | sort
          find node_modules -type f -name '*.node' -print | grep -Ev '^node_modules/(raknet-native|raknet-node)/' > /tmp/vf-unexpected-native || true
          if test -s /tmp/vf-unexpected-native; then
            echo 'STOP: unexpected native modules require an Android-compatible build:' >&2
            cat /tmp/vf-unexpected-native >&2
            exit 1
          fi
          find node_modules/raknet-native node_modules/raknet-node -type f -name '*.node' -delete 2>/dev/null || true
          node --input-type=module -e "import('bedrock-protocol').then(m=>{if(typeof m.default?.createClient!=='function') throw Error('Bedrock client missing');console.log('Pure JS Bedrock import OK')})"
          test -z "$(find node_modules -type f -name '*.node' -print -quit)"
          echo 'No Linux native addons will be bundled in the Android APK'
          echo 'Remove redundant gzipped copies that Android merges onto existing asset names'
          find node_modules -type f -name '*.gz' -print0 | while IFS= read -r -d '' file; do
            if test -f "${file%.gz}"; then
              echo "Excluding duplicate Android asset: $file"
              rm -f "$file"
            fi
          done
          echo 'Prune non-runtime prismarine-nbt sample data that Android asset merger treats as duplicate'
          rm -rf node_modules/prismarine-nbt/sample
          test ! -e node_modules/prismarine-nbt/sample/bigtest.nbt
          test ! -e node_modules/prismarine-nbt/sample/bigtest.nbt.gz
      - name: Retry Realms join endpoint 503 only, test successful rejoin and auth safety
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          node --test realm-ai-phone-build/realm-join-503-retry.test.cjs
          python3 realm-ai-phone-build/patch_bedrock_realm_join_v098.py "$BASE"
          node --check "$BASE/bedrock-agent/node_modules/bedrock-protocol/src/client/auth.js"
          node --check "$BASE/bedrock-agent/node_modules/bedrock-protocol/src/client/realmJoin503Retry.js"
          grep -q "joinRealmWithRetry" "$BASE/bedrock-agent/node_modules/bedrock-protocol/src/client/auth.js"
      - name: Remove competing Bedrock pack auto-complete, verify exactly one handshake owner
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          python3 realm-ai-phone-build/patch_single_pack_owner_v099.py "$BASE"
          node --check "$BASE/bedrock-agent/node_modules/bedrock-protocol/src/createClient.js"
          node realm-ai-phone-build/verify_single_pack_owner_v099.cjs "$BASE"
          (cd "$BASE/bedrock-agent" && node --test tests/cdn-packs.test.js tests/resource-packs.test.js)
      - name: Correct 1.26.60 packet enum and validate REAL serializer bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          python3 realm-ai-phone-build/fix_bedrock_12660_schema.py "$BASE"
          node realm-ai-phone-build/verify_12660_pack_wire.cjs "$BASE"
      - name: Keep CDN transfer state independent from server chunk headers (v0.9.10)
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          python3 realm-ai-phone-build/patch_cdn_owner_v0910.py "$BASE"
          cp realm-ai-phone-build/v0910-cdn-tests.test.js "$BASE/bedrock-agent/tests/cdn-packs.test.js"
          sed -i 's/versionCode 18/versionCode 19/;s/0.9.9-one-pack-handler/0.9.10-cdn-owner/' "$BASE/android-app/app/build.gradle"
          (cd "$BASE/bedrock-agent" && npm test)
      - name: Repair pack response variant discriminants using independent fixtures
        shell: bash
        run: |
          set -euo pipefail
          BASE='.vf-phone-build/veilforge_realm_v09_apk_ready'
          python3 realm-ai-phone-build/patch_pack_wire_v0911.py "$BASE"
          cp realm-ai-phone-build/v0911-cdn-tests.test.js "$BASE/bedrock-agent/tests/cdn-packs.test.js"
          sed -i 's/versionCode 19/versionCode 100003/;s/0.9.10-cdn-owner/0.13-adaptive-recovery/' "$BASE/android-app/app/build.gradle"
          node realm-ai-phone-build/verify_pack_wire_v0911.cjs "$BASE"
          (cd "$BASE/bedrock-agent" && npm test)
      - name: Acquire checksum-verified Android 16 KB Node native runtime
        working-directory: .vf-phone-build/veilforge_realm_v09_apk_ready
        run: python3 tools/prepare_android_node.py
      - name: Select C++20 for Node.js 24 native headers
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app'
          sed -i 's/-std=c++17 -fexceptions/-std=c++20 -fexceptions/' "$ROOT/build.gradle"
          sed -i 's/cxx_std_17/cxx_std_20/' "$ROOT/CMakeLists.txt"
          grep -q -- '-std=c++20 -fexceptions' "$ROOT/build.gradle"
          grep -q 'cxx_std_20' "$ROOT/CMakeLists.txt"
          echo 'Avoid duplicate libnode/libc++ packaging: AGP CMake imported targets own the native outputs'
          sed -i "/sourceSets.main.jniLibs.srcDir 'libnode\\/bin'/d" "$ROOT/build.gradle"
          if grep -q "sourceSets.main.jniLibs.srcDir 'libnode/bin'" "$ROOT/build.gradle"; then
            echo 'STOP: duplicate JNI source still configured' >&2; exit 1
          fi
      - name: Compile signed Android debug APK
        shell: bash
        run: gradle -p .vf-phone-build/veilforge_realm_v09_apk_ready/android-app :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: APK integrity, native libs, embedded bot and signature verification
        shell: bash
        run: |
          set -euo pipefail
          APK='.vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" | tail -n1
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libnode.so$'
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libveilforge_bridge.so$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/mobile.js$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/src/realm-packs.js$'
          unzip -Z1 "$APK" | grep -q '^assets/nodejs-project/node_modules/bedrock-protocol/package.json$'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          sha256sum "$APK"
      - name: Stage signer tool for private local permanent signing
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p signing-tool
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
      - name: Upload verified APK and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: VEILFORGE-Realm-AI-v0.13-Adaptive-Verified-APK
          path: |
            .vf-phone-build/veilforge_realm_v09_apk_ready/android-app/app/build/outputs/apk/debug/app-debug.apk
            signing-tool/apksigner.jar
          retention-days: 7
          if-no-files-found: error
