name: Pek's Plunder v0.6 - APK and bounded emulator inspection
on:
  push:
    branches: [feature/peks-plunder-daycycle-minigames-v06-20261018]
    paths:
      - 'pecks-cove-capers/**'
      - '.github/workflows/peks-plunder-v06.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: peks-plunder-v06-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Validate game source and manual service logic
        run: |
          node --check pecks-cove-capers/web/game.js
          node pecks-cove-capers/test_logic.cjs
          test -s pecks-cove-capers/android/app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build offline APK
        working-directory: pecks-cove-capers/android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Peks-Plunder-v06-APK
          path: pecks-cove-capers/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with: {name: Peks-Plunder-v06-APK, path: apk}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Single emulator smoke (start intro, enter shift, capture evidence)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r apk/app-debug.apk
            adb shell am start -n com.peckscove.capers/.MainActivity
            mkdir -p screenshots
            sleep 3
            adb exec-out screencap -p > screenshots/sunrise.png
            sleep 5
            adb exec-out screencap -p > screenshots/crew.png
            python3 - <<'PY'
            import struct
            raw=open('screenshots/crew.png','rb').read()
            assert raw.startswith(b'\x89PNG\r\n\x1a\n')
            w,h=struct.unpack('>II',raw[16:24]);print('emulator',w,h)
            open('screenshots/resolution.txt','w').write(f'{w} {h}\n')
            PY
            read w h < screenshots/resolution.txt
            adb shell input tap "$((w*82/100))" "$((h*82/100))"
            sleep 5
            adb exec-out screencap -p > screenshots/shift.png
            adb logcat -d -s chromium:E cr_WebView:E AndroidRuntime:E > screenshots/logcat.txt || true
            test -s screenshots/shift.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Peks-Plunder-v06-emulator-evidence
          path: screenshots/
          retention-days: 7
