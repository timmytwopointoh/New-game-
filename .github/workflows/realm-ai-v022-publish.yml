name: Publish VEILFORGE Realm AI v0.22 selected-file sharing test APK
on:
  push:
    branches:
      - sandbox/realm-ai-v013-adaptive-recovery-20261031
    paths:
      - 'realm-ai-phone-build/v022-publish-requests/**'
permissions:
  contents: write
concurrency:
  group: realm-v022-requested-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct exact APK from public v0.21 APK bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/timmytwopointoh/New-game-/releases/download/veilforge-realm-ai-v021-microsoft-link-test/VEILFORGE-Realm-AI-v0.21-Microsoft-Link-TEST.apk' -o public-base.apk
          python3 realm-ai-phone-build/materialize_v022_apk.py public-base.apk realm-ai-phone-build/v022-public-apk-recipe.json.xz.b64 VEILFORGE-Realm-AI-v0.22-Selected-File-Share-TEST.apk
          cp realm-ai-phone-build/v022-publication/v022-source.zip .
          cp realm-ai-phone-build/v022-public-apk-recipe.json.xz.b64 .
          sha256sum -c realm-ai-phone-build/v022-publication/VEILFORGE-Realm-AI-v0.22-SHA256.txt
      - name: Install Android verification tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Verify package, certificate, file picker and least-privilege manifest
        shell: bash
        run: |
          set -euo pipefail
          APK='VEILFORGE-Realm-AI-v0.22-Selected-File-Share-TEST.apk'
          TOOLS="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > certificate-report.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: b5d275706b574eea53d6497a3a65542542b5db0e0e57f4e307e8ed17cf24f995' certificate-report.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > alignment-report.txt
          "$TOOLS/aapt" dump badging "$APK" > package-report.txt
          grep -q "package: name='com.veilforge.realmagent' versionCode='100019'" package-report.txt
          grep -q "versionName='0.22-file-share-v0'" package-report.txt
          "$TOOLS/aapt" dump permissions "$APK" > permission-report.txt
          if grep -Eq 'READ_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE' permission-report.txt; then exit 1; fi
          python3 - <<'PY'
          import gzip, json, zipfile
          from pathlib import Path
          apk='VEILFORGE-Realm-AI-v0.22-Selected-File-Share-TEST.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              dex=z.read('classes2.dex')
              for token in [b'Share one file',b'Share selected file',b'android.intent.action.OPEN_DOCUMENT',b'android.intent.action.SEND',b'android.intent.extra.STREAM',b'https://www.microsoft.com/link']:
                  assert token in dex, token
              words=json.loads(gzip.decompress(z.read('assets/nodejs-project/src/lexicon/english-5000.json.gz')))
              assert len(words['words']) == 5000
          activity=Path('realm-ai-phone-build/v022-overlay/android-app/app/src/main/java/com/veilforge/realmagent/MainActivity.java').read_text()
          for token in ['ACTION_OPEN_DOCUMENT','FLAG_GRANT_READ_URI_PERMISSION','ClipData.newUri','ACTION_SEND','Share one file']:
              assert token in activity, token
          assert 'takePersistableUriPermission' not in activity
          assert 'MANAGE_EXTERNAL_STORAGE' not in activity
          manifest=Path('realm-ai-phone-build/v022-overlay/android-app/app/src/main/AndroidManifest.xml').read_text()
          assert 'READ_EXTERNAL_STORAGE' not in manifest and 'MANAGE_EXTERNAL_STORAGE' not in manifest
          test=Path('realm-ai-phone-build/v022-overlay/android-app/app/src/test/java/com/veilforge/realmagent/ButtonActionsTest.java').read_text()
          assert 'shareFileUsesAndroidPickerThenOnlySharesChosenUriReadOnly' in test
          with zipfile.ZipFile('v022-source.zip') as source:
              assert source.testzip() is None
              names=source.namelist()
              assert not any(n.endswith(('.p12','.jks','.keystore')) or 'signing-password' in n for n in names)
          PY
      - name: Publish APK and public source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='veilforge-realm-ai-v022-selected-file-share-test'
          APK='VEILFORGE-Realm-AI-v0.22-Selected-File-Share-TEST.apk'
          ASSETS=("$APK" v022-public-apk-recipe.json.xz.b64 v022-source.zip realm-ai-phone-build/v022-publication/VEILFORGE-Realm-AI-v0.22-SHA256.txt realm-ai-phone-build/v022-publication/verification.json realm-ai-phone-build/v022-publication/release-notes.md certificate-report.txt alignment-report.txt package-report.txt permission-report.txt)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'VEILFORGE Realm AI v0.22 — selected file share TEST' --notes-file realm-ai-phone-build/v022-publication/release-notes.md
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title 'VEILFORGE Realm AI v0.22 — selected file share TEST' --notes-file realm-ai-phone-build/v022-publication/release-notes.md
