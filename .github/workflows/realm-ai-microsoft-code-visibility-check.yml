name: Realm AI Microsoft code foreground UI validation
# Re-run with Robolectric dialog assertions corrected, no changes to bot logic.
on:
  push:
    branches: [feature/realm-ai-0391-microsoft-code-frontmost-20261101]
    paths: ['.github/workflows/realm-ai-microsoft-code-visibility-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard the previous Realm and Microsoft authentication implementation
        run: |
          set -euo pipefail
          ORIGINAL=0d8e347686a20f40686c211c6bec24675f3320f9
          git diff --exit-code "$ORIGINAL" HEAD -- realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
          git diff --exit-code "$ORIGINAL" HEAD -- realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/build.gradle
          git diff --exit-code "$ORIGINAL" HEAD -- realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/src/main/AndroidManifest.xml
          git diff --exit-code "$ORIGINAL" HEAD -- realm-ai-phone-build/realm-ai-live-v021-overlay/android-app/app/src/main/java/com/veilforge/realmagent/BotService.java
          echo "Game logic, auth transport, package identity, and Android service remain UNCHANGED."
      - name: Install exact production bot dependencies and test JavaScript
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/bedrock-agent
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund
          node --test tests/*.test.js
      - name: Restore verified native runtime
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay
        run: python3 tools/fetch_native_runtime.py
      - name: Test Microsoft foreground, copy, deep link and compile original-ID Android app
        working-directory: realm-ai-phone-build/realm-ai-live-v021-overlay/android-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          echo 'Android unit tests and real APK compilation passed. Package is unsigned: DO NOT install as v0.38 update.'
